name: Deploy EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      APP_JAR: property-management-0.0.1-SNAPSHOT.jar
      REMOTE_APP_DIR: /opt/pms/app
      REMOTE_SERVICE_NAME: pms

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Build jar
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Validate deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || (echo "EC2_HOST is empty" && exit 1)
          test -n "$EC2_USER" || (echo "EC2_USER is empty" && exit 1)
          test -n "$EC2_SSH_KEY" || (echo "EC2_SSH_KEY is empty" && exit 1)
          echo "EC2_HOST loaded"
          echo "EC2_USER loaded"
          echo "EC2_SSH_KEY length: $(printf '%s' "$EC2_SSH_KEY" | wc -c)"

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null
          ssh-keyscan -T 30 -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload artifact
        run: |
          scp "target/${APP_JAR}" "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/${APP_JAR}"

      - name: Restart service
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "
            sudo mv /tmp/${APP_JAR} ${REMOTE_APP_DIR}/${APP_JAR} &&
            sudo chown pms:pms ${REMOTE_APP_DIR}/${APP_JAR} &&
            sudo systemctl restart ${REMOTE_SERVICE_NAME} &&
            for i in {1..12}; do
              curl --fail --silent http://127.0.0.1:8080/health && exit 0
              sleep 5
            done &&
            sudo systemctl status ${REMOTE_SERVICE_NAME} --no-pager &&
            journalctl -u ${REMOTE_SERVICE_NAME} -n 120 --no-pager &&
            exit 1
          "
