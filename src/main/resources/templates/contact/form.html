<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contact Owner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0">Contact Owner</h3>
                </div>
                <div class="card-body">
                    <!-- Room Info -->
                    <div class="mb-4 p-3 bg-light rounded border">
                        <h5>Room: <span class="text-primary" th:text="${room.roomNumber}">101</span></h5>
                        <p class="mb-1"><strong>Price:</strong> <span th:text="${#numbers.formatDecimal(room.price, 0, 'COMMA', 0, 'POINT')} + ' VND'">5,000,000 VND</span></p>
                        <p class="mb-0"><strong>Address:</strong> <span th:text="${room.property.addressNumber}">123 ABC Street</span></p>
                    </div>

                    <!-- Alert Messages -->
                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                    <!-- Contact Form -->
                    <form th:action="@{/contact/send}" th:object="${inquiry}" method="post">
                        <input type="hidden" name="roomId" th:value="${room.id}" />

                        <!-- Contact Phone -->
                        <div class="mb-3">
                            <label for="contactPhone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="contactPhone" th:field="*{contactPhone}" 
                                   placeholder="Enter your phone number (10-11 digits)"
                                   th:classappend="${#fields.hasErrors('contactPhone')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('contactPhone')}" th:errors="*{contactPhone}"></div>
                        </div>

                        <!-- Contact Email -->
                        <div class="mb-3">
                            <label for="contactEmail" class="form-label">Email (Optional)</label>
                            <input type="email" class="form-control" id="contactEmail" th:field="*{contactEmail}" 
                                   placeholder="name@example.com"
                                   th:classappend="${#fields.hasErrors('contactEmail')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('contactEmail')}" th:errors="*{contactEmail}"></div>
                        </div>

                        <!-- Message -->
                        <div class="mb-3">
                            <label for="message" class="form-label">Message <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="message" th:field="*{message}" rows="5" 
                                      placeholder="I am interested in this room..."
                                      th:classappend="${#fields.hasErrors('message')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Send Inquiry</button>
                            <a th:href="@{/rooms/{id}(id=${room.id})}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
