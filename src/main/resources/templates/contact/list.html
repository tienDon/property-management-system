<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inquiry List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">PMS Admin</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Contact Inquiries</h2>
    </div>

    <!-- Alert Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}">Success message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Room</th>
                        <th>Sender Info</th>
                        <th>Message Preview</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="inquiry : ${inquiries}">
                        <td th:text="${inquiry.id}">1</td>
                        <td>
                            <span class="badge bg-secondary" th:text="${inquiry.room.roomNumber}">101</span>
                            <br>
                            <small class="text-muted" th:text="${inquiry.property.name}">Building A</small>
                        </td>
                        <td>
                            <div th:if="${inquiry.sender != null}">
                                <i class="bi bi-person-fill"></i> <span th:text="${inquiry.sender.username}">User</span>
                            </div>
                            <div><i class="bi bi-telephone"></i> <span th:text="${inquiry.contactPhone}">0909...</span></div>
                            <div th:if="${inquiry.contactEmail}"><i class="bi bi-envelope"></i> <span th:text="${inquiry.contactEmail}">email@...</span></div>
                        </td>
                        <td>
                            <span th:text="${#strings.abbreviate(inquiry.message, 50)}">Short message...</span>
                        </td>
                        <td th:text="${#temporals.format(inquiry.createdAt, 'dd-MM-yyyy HH:mm')}">2023-01-01 12:00</td>
                        <td>
                            <span th:if="${inquiry.status == 'PENDING'}" class="badge bg-warning text-dark">PENDING</span>
                            <span th:if="${inquiry.status == 'CONTACTED'}" class="badge bg-info text-dark">CONTACTED</span>
                            <span th:if="${inquiry.status == 'CLOSED'}" class="badge bg-success">CLOSED</span>
                        </td>
                        <td>
                            <a th:href="@{/contact/{id}(id=${inquiry.id})}" class="btn btn-sm btn-primary">
                                <i class="bi bi-eye"></i> View
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${inquiries.isEmpty()}">
                        <td colspan="7" class="text-center py-4 text-muted">No inquiries found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
