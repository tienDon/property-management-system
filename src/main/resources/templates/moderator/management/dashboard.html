<div>
  <h1 class="text-2xl font-bold text-gray-900 mb-1">Tổng quan</h1>
  <p class="text-sm text-gray-500 mb-6">
    Chào mừng bạn quay lại,
    <span th:text="${session.user?.fullName ?: 'Moderator'}"></span>.
  </p>

  <!-- Stat cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 max-w-xl">
    <a
      href="/moderator/posts/pending"
      class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 flex items-center gap-4 hover:shadow-md transition"
    >
      <div
        class="w-12 h-12 bg-orange-100 text-orange-500 rounded-xl flex items-center justify-center text-xl"
      >
        <i class="fa-solid fa-clock"></i>
      </div>
      <div>
        <p class="text-2xl font-bold text-gray-900" th:text="${totalPending}">
          0
        </p>
        <p class="text-sm text-gray-500">Bài chờ duyệt</p>
      </div>
    </a>

    <a
      href="/moderator/posts/re-review"
      class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 flex items-center gap-4 hover:shadow-md transition"
    >
      <div
        class="w-12 h-12 bg-blue-100 text-blue-500 rounded-xl flex items-center justify-center text-xl"
      >
        <i class="fa-solid fa-rotate"></i>
      </div>
      <div>
        <p class="text-2xl font-bold text-gray-900" th:text="${totalReReview}">
          0
        </p>
        <p class="text-sm text-gray-500">Bài duyệt lại</p>
      </div>
    </a>
  </div>
</div>
