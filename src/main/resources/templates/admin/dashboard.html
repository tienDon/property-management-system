<div th:fragment="content">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Dashboard Quản trị</h1>
        <p class="text-gray-500 mt-2">Theo dõi doanh thu và hoạt động mua gói đăng tin.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Total System Revenue -->
        <div class="bg-white rounded-2xl p-8 shadow-lg border border-gray-100 flex items-center transform transition hover:scale-105 duration-300">
            <div class="w-16 h-16 rounded-full bg-purple-100 flex items-center justify-center text-purple-600 mr-6 shadow-sm">
                <i class="fa-solid fa-sack-dollar text-2xl"></i>
            </div>
            <div>
                <p class="text-sm text-gray-500 font-semibold uppercase tracking-wide">Tổng doanh thu hệ thống</p>
                <h3 class="text-3xl font-extrabold text-gray-900 mt-1" 
                    th:text="${#numbers.formatDecimal(stats.totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                    0 VNĐ
                </h3>
                <p class="text-xs text-purple-500 mt-1 font-medium">Từ các gói đăng tin</p>
            </div>
        </div>

        <!-- Owners Purchased Packages -->
        <div class="bg-white rounded-2xl p-8 shadow-lg border border-gray-100 flex items-center transform transition hover:scale-105 duration-300">
            <div class="w-16 h-16 rounded-full bg-orange-100 flex items-center justify-center text-orange-600 mr-6 shadow-sm">
                <i class="fa-solid fa-users-gear text-2xl"></i>
            </div>
            <div>
                <p class="text-sm text-gray-500 font-semibold uppercase tracking-wide">Chủ trọ đã mua gói</p>
                <h3 class="text-3xl font-extrabold text-gray-900 mt-1" th:text="${stats.ownersPurchased}">
                    0
                </h3>
                <p class="text-xs text-orange-500 mt-1 font-medium">Số lượng chủ trọ độc nhất</p>
            </div>
        </div>
    </div>

    <div class="mt-8">
        <h2 class="text-2xl font-bold text-gray-900 mb-4">Thống kê API</h2>
        <div class="overflow-x-auto bg-white rounded-lg shadow">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tên Api</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Đường dẫn</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tổng số</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Thành công</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Lỗi đầu vào (400)</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Lỗi khách hàng</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Lỗi hệ thống</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="api : ${apiStats}">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${api.apiName}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${api.path}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${api.total}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-green-600" th:text="${api.success}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-yellow-600" th:text="${api.inputError}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-orange-600" th:text="${api.clientError}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-red-600" th:text="${api.systemError}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
