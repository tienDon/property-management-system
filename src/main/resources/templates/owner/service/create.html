<div th:fragment="content" class="bg-gray-50 min-h-screen py-8">
  <div class="max-w-4xl mx-auto">
    <form
      th:action="@{/owner/services/create}"
      th:object="${serviceRequest}"
      method="POST"
      class="bg-white p-8 rounded-xl shadow-sm border border-gray-100"
    >
      <div
        class="flex justify-between items-center mb-8 pb-4 border-b border-gray-100"
      >
        <h2
          class="text-xl font-bold text-gray-800 uppercase tracking-wide flex items-center gap-3"
        >
          <span class="w-1.5 h-6 bg-blue-600 rounded-full"></span>
          Tạo Dịch Vụ Mới
        </h2>
        <a
          th:href="@{/owner/services}"
          class="text-gray-500 hover:text-gray-700 text-sm font-medium transition-colors"
        >
          <i class="fa-solid fa-arrow-left mr-1"></i> Quay lại
        </a>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Cột trái: Thông tin cơ bản -->
        <div class="space-y-6">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">
              Tên dịch vụ <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              th:field="*{name}"
              placeholder="Ví dụ: Điện sinh hoạt, Nước máy..."
              required
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all shadow-sm"
            />
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">
              Loại dịch vụ <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <select
                th:field="*{type}"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 appearance-none bg-white"
              >
                <option value="FIXED">Cố định (Theo tháng, người...)</option>
                <option value="METERED">Theo chỉ số (Điện, Nước...)</option>
              </select>
              <i
                class="fa-solid fa-chevron-down absolute right-4 top-4 text-gray-400 pointer-events-none"
              ></i>
            </div>
            <p class="text-xs text-gray-500 mt-2">
              <i class="fa-solid fa-circle-info text-blue-500 mr-1"></i>
              <strong>Cố định:</strong> Giá tiền không đổi mỗi tháng.<br />
              <strong>Theo chỉ số:</strong> Tính tiền dựa trên số cũ - số mới.
            </p>
          </div>
        </div>

        <!-- Cột phải: Giá và Đơn vị -->
        <div class="space-y-6">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">
              Giá dịch vụ (VNĐ) <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <input
                type="number"
                th:field="*{price}"
                placeholder="Nhập giá tiền"
                required
                min="0"
                step="100"
                class="w-full pl-4 pr-12 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all font-medium text-gray-700"
              />
              <span
                class="absolute right-4 top-3 text-gray-400 font-bold text-sm"
                >đ</span
              >
            </div>
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">
              Đơn vị tính <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <input
                type="text"
                th:field="*{unit}"
                list="unitSuggestions"
                placeholder="Chọn hoặc nhập đơn vị"
                required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700"
              />
              <datalist id="unitSuggestions">
                <option value="Kwh"></option>
                <option value="m3 (Khối)"></option>
                <option value="Tháng"></option>
                <option value="Người"></option>
                <option value="Phòng"></option>
                <option value="Xe"></option>
                <option value="Lần"></option>
              </datalist>
            </div>
          </div>
        </div>

        <!-- Nhà trọ áp dụng (Full width) -->
        <div class="md:col-span-2">
          <label class="block text-sm font-bold text-gray-700 mb-2">
            Áp dụng cho nhà trọ <span class="text-red-500">*</span>
          </label>
          <div
            th:if="${#lists.isEmpty(properties)}"
            class="p-4 bg-yellow-50 text-yellow-700 rounded-lg border border-yellow-200 flex items-center gap-3"
          >
            <i class="fa-solid fa-triangle-exclamation text-xl"></i>
            <div>
              <p class="font-bold text-sm">Bạn chưa có nhà trọ nào!</p>
              <a
                th:href="@{/owner/property/create}"
                class="text-sm underline hover:text-yellow-800"
                >Tạo nhà trọ ngay</a
              >
              để thêm dịch vụ.
            </div>
          </div>

          <div
            th:if="${not #lists.isEmpty(properties)}"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
          >
            <label th:each="p : ${properties}" class="cursor-pointer group">
              <input
                type="radio"
                th:field="*{propertyId}"
                th:value="${p.id}"
                required
                class="peer hidden"
              />
              <div
                class="p-4 border-2 border-gray-200 rounded-xl hover:border-blue-400 peer-checked:border-blue-600 peer-checked:bg-blue-50 transition-all h-full"
              >
                <div class="flex items-center gap-3 mb-2">
                  <div
                    class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 group-hover:bg-blue-100 group-hover:text-blue-600 peer-checked:bg-blue-600 peer-checked:text-white transition-colors"
                  >
                    <i class="fa-solid fa-house"></i>
                  </div>
                  <p
                    class="font-bold text-gray-800 text-sm truncate"
                    th:text="${p.name}"
                  ></p>
                </div>
                <p
                  class="text-xs text-gray-500 pl-[52px]"
                  th:text="${p.addressNumber}"
                ></p>
              </div>
            </label>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-end gap-4 mt-8 pt-6 border-t border-gray-100">
        <a
          th:href="@{/owner/services}"
          class="px-6 py-3 bg-white border border-gray-300 text-gray-700 font-bold rounded-lg hover:bg-gray-50 transition-colors"
        >
          Hủy bỏ
        </a>
        <button
          type="submit"
          class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-lg shadow-blue-200 transition-all flex items-center gap-2"
        >
          <i class="fa-solid fa-check"></i> Hoàn tất
        </button>
      </div>
    </form>
  </div>
</div>
