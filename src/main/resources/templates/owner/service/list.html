<div th:fragment="content" class="bg-gray-50 min-h-screen">
  <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 mb-6">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">Quản lý dịch vụ</h2>
      <a
        th:href="@{/owner/services/create}"
        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center gap-2 transition-colors shadow-md"
      >
        <i class="fa-solid fa-plus"></i>
        Thêm dịch vụ
      </a>
    </div>

    <!-- Filter Bar -->
    <div class="flex justify-between items-center mb-4">
      <div class="flex items-center gap-2 text-sm text-gray-600">
        <span>Hiển thị</span>
        <select
          class="border border-gray-300 rounded px-2 py-1 focus:outline-none focus:border-blue-500"
        >
          <option>25</option>
          <option>50</option>
          <option>100</option>
        </select>
      </div>
      <div class="relative">
        <input
          type="text"
          placeholder="Nhập từ khóa tìm kiếm..."
          class="border border-gray-300 rounded px-4 py-1.5 w-64 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        />
        <i
          class="fa-solid fa-magnifying-glass absolute right-3 top-2.5 text-gray-400 text-xs"
        ></i>
      </div>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr
            class="border-b border-gray-200 text-sm font-semibold text-gray-700 bg-white"
          >
            <th class="py-3 px-4">
              <div
                class="flex items-center gap-1 cursor-pointer hover:text-blue-600"
              >
                Tên <i class="fa-solid fa-sort text-gray-300 text-xs"></i>
              </div>
            </th>
            <th class="py-3 px-4">
              <div
                class="flex items-center gap-1 cursor-pointer hover:text-blue-600"
              >
                Loại <i class="fa-solid fa-sort text-gray-300 text-xs"></i>
              </div>
            </th>
            <th class="py-3 px-4">
              <div
                class="flex items-center gap-1 cursor-pointer hover:text-blue-600"
              >
                Giá tiền (đ)
                <i class="fa-solid fa-sort text-gray-300 text-xs"></i>
              </div>
            </th>
            <th class="py-3 px-4">
              <div
                class="flex items-center gap-1 cursor-pointer hover:text-blue-600"
              >
                Đơn vị <i class="fa-solid fa-sort text-gray-300 text-xs"></i>
              </div>
            </th>
            <th class="py-3 px-4">
              <div
                class="flex items-center gap-1 cursor-pointer hover:text-blue-600"
              >
                Nhà trọ <i class="fa-solid fa-sort text-gray-300 text-xs"></i>
              </div>
            </th>
            <th class="py-3 px-4">Ngày tạo</th>
            <th class="py-3 px-4 text-center">Hành động</th>
          </tr>
        </thead>
        <tbody class="text-sm text-gray-700">
          <tr
            th:if="${#lists.isEmpty(services)}"
            class="border-b border-gray-100 bg-gray-50"
          >
            <td colspan="7" class="py-8 text-center text-gray-500">
              Chưa có dữ liệu
            </td>
          </tr>
          <tr
            th:each="s : ${services}"
            class="border-b border-gray-100 hover:bg-gray-50 transition-colors"
          >
            <td class="py-3 px-4 font-medium text-gray-800" th:text="${s.name}">
              Điện
            </td>
            <td class="py-3 px-4">
              <span
                th:if="${s.type.name() == 'FIXED'}"
                class="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-1 rounded"
                >Cố định</span
              >
              <span
                th:if="${s.type.name() == 'METERED'}"
                class="bg-orange-100 text-orange-700 text-xs font-bold px-2 py-1 rounded"
                >Theo chỉ số</span
              >
            </td>
            <td
              class="py-3 px-4 font-bold text-gray-800"
              th:text="${#numbers.formatDecimal(s.price, 0, 'COMMA', 0, 'POINT')}"
            >
              3,500
            </td>
            <td class="py-3 px-4" th:text="${s.unit}">Kwh</td>
            <td class="py-3 px-4" th:text="${s.propertyName}">Trọ A</td>
            <td class="py-3 px-4" th:text="${s.formattedCreatedAt}">
              27/01/2026
            </td>
            <td class="py-3 px-4 text-center">
              <a
                th:href="@{/owner/services/delete/{id}(id=${s.id})}"
                onclick="
                  return confirm('Bạn có chắc chắn muốn xóa dịch vụ này?');
                "
                class="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-full transition-colors"
                title="Xóa"
              >
                <i class="fa-solid fa-trash-can"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="mt-4 text-xs text-gray-500">
      Hiển thị <span th:text="${services.size()}">0</span> mục
    </div>
  </div>

  {{/*
  <!-- Alert Success -->
  <div
    th:if="${param.success}"
    class="fixed bottom-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg animate-bounce z-50 flex items-center gap-2"
  >
    <i class="fa-solid fa-circle-check"></i>
    <span>Lưu thành công!</span>
  </div>
  <div
    th:if="${param.deleted}"
    class="fixed bottom-4 right-4 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg animate-bounce z-50 flex items-center gap-2"
  >
    <i class="fa-solid fa-trash"></i>
    <span>Đã xóa dịch vụ!</span>
  </div>
  */}}

  <style>
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fade-in-down {
      animation: fadeInDown 0.3s ease-out;
    }
  </style>
</div>
