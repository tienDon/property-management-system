<div th:fragment="content">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Chi tiết yêu cầu bảo trì</h1>
            <p class="text-sm text-gray-500" th:text="${request.code != null ? request.code : request.id}">MR-...</p>
        </div>
        <a href="/owner/maintenance" class="text-sm text-blue-600 hover:underline">&larr; Quay lại</a>
    </div>

    <div th:if="${param.success}" class="mb-4 p-3 bg-green-100 text-green-800 rounded">
        Thao tác thành công.
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-3">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <div class="text-xs text-gray-500">Phòng</div>
                <div class="font-semibold text-gray-900" th:text="${request.room != null ? request.room.name : 'N/A'}"></div>
                <div class="text-sm text-gray-600" th:text="${request.room != null && request.room.property != null ? request.room.property.name : ''}"></div>
            </div>
            <div>
                <div class="text-xs text-gray-500">Khách thuê</div>
                <div class="font-semibold text-gray-900" th:text="${request.tenant != null ? (request.tenant.fullName != null ? request.tenant.fullName : request.tenant.username) : 'N/A'}"></div>
                <div class="text-sm text-gray-600" th:text="${request.tenant != null ? request.tenant.phone : ''}"></div>
            </div>
        </div>

        <div>
            <div class="text-xs text-gray-500">Danh mục</div>
            <div class="font-medium text-gray-900" th:text="${request.category.displayName}"></div>
        </div>

        <div>
            <div class="text-xs text-gray-500">Mô tả</div>
            <div class="text-gray-700 whitespace-pre-line" th:text="${request.description}"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <div class="text-xs text-gray-500">Trạng thái</div>
                <div class="font-semibold" th:text="${request.status.displayName}"></div>
            </div>
            <div>
                <div class="text-xs text-gray-500">Nhân viên</div>
                <div class="font-semibold" th:text="${request.staff != null ? (request.staff.fullName != null ? request.staff.fullName : request.staff.username) : '-'}"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <div class="text-xs text-gray-500">Phân công lúc</div>
                <div class="text-sm text-gray-700" th:text="${request.assignedAt != null ? #temporals.format(request.assignedAt, 'dd/MM/yyyy HH:mm') : '-'}"></div>
            </div>
            <div>
                <div class="text-xs text-gray-500">Bắt đầu lúc</div>
                <div class="text-sm text-gray-700" th:text="${request.startedAt != null ? #temporals.format(request.startedAt, 'dd/MM/yyyy HH:mm') : '-'}"></div>
            </div>
            <div>
                <div class="text-xs text-gray-500">Hoàn thành lúc</div>
                <div class="text-sm text-gray-700" th:text="${request.completedAt != null ? #temporals.format(request.completedAt, 'dd/MM/yyyy HH:mm') : '-'}"></div>
            </div>
        </div>

        <div th:if="${request.status.name() == 'REJECTED'}" class="p-3 bg-red-50 text-red-700 rounded">
            <div class="font-semibold">Lý do từ chối</div>
            <div class="text-sm whitespace-pre-line" th:text="${request.rejectedReason}"></div>
        </div>
        <div th:if="${request.status.name() == 'COMPLETED' or request.status.name() == 'CONFIRMED'}" class="p-3 bg-gray-50 text-gray-700 rounded">
            <div class="font-semibold">Ghi chú hoàn thành</div>
            <div class="text-sm whitespace-pre-line" th:text="${request.completionNote}"></div>
        </div>
        <div th:if="${request.status.name() == 'REOPENED'}" class="p-3 bg-purple-50 text-purple-700 rounded">
            <div class="font-semibold">Lý do mở lại</div>
            <div class="text-sm whitespace-pre-line" th:text="${request.reopenedReason}"></div>
        </div>
    </div>

    <div th:if="${request.status.name() == 'PENDING'}" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-3">Phân công</h2>
            <p class="text-sm text-red-600 mb-2" th:if="${errorAssign != null}" th:text="${errorAssign}"></p>
            <form th:action="@{|/owner/maintenance/${request.id}/assign|}" method="post">
                <label class="block text-sm font-medium mb-2">Chọn nhân viên</label>
                <select name="staffId" class="w-full border rounded px-3 py-2">
                    <option value="">-- Chọn --</option>
                    <option th:each="s : ${staffs}" th:value="${s.id}" th:text="${s.fullName != null ? s.fullName : s.username}"></option>
                </select>
                <button type="submit" class="mt-3 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Phân công</button>
            </form>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-3">Từ chối</h2>
            <p class="text-sm text-red-600 mb-2" th:if="${errorReject != null}" th:text="${errorReject}"></p>
            <form th:action="@{|/owner/maintenance/${request.id}/reject|}" method="post">
                <label class="block text-sm font-medium mb-2">Lý do</label>
                <textarea name="reason" rows="4" class="w-full border rounded px-3 py-2" th:text="${rejectReason}"></textarea>
                <button type="submit" class="mt-3 px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">Từ chối</button>
            </form>
        </div>
    </div>
</div>
