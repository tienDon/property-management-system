<div th:fragment="content" class="bg-gray-50 min-h-screen py-8">
  <form
    th:action="@{${actionUrl}}"
    th:object="${propertyRequest}"
    method="POST"
    class="space-y-6"
  >
    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
      <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
        <span class="w-1 h-6 bg-blue-600 mr-3"></span> Thông tin nhà trọ, phòng
        trọ
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="md:col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Loại hình <span class="text-red-500">*</span></label
          >
          <select
            th:field="*{categoryId}"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
          >
            <option value="">-- Chọn loại hình --</option>
            <option
              th:each="c : ${categories}"
              th:value="${c.id}"
              th:text="${c.name}"
            ></option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Số lượng phòng</label
            >
            <input
              type="number"
              th:field="*{numberOfRooms}"
              min="1"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Giá thuê</label
            >
            <input
              type="number"
              th:field="*{price}"
              min="1"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            />
          </div>
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Tiêu đề bài đăng <span class="text-red-500">*</span></label
          >
          <input
            type="text"
            th:field="*{title}"
            placeholder="Ví dụ: Phòng trọ cao cấp, full nội thất quận 8..."
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Tên nhà trọ</label
          >
          <input
            type="text"
            th:field="*{name}"
            placeholder="Ví dụ: Trọ cô Ba"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Diện tích ($m^2$)</label
          >
          <input
            type="number"
            step="0.1"
            th:field="*{acreage}"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          />
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Mô tả chi tiết</label
          >
          <textarea
            th:field="*{description}"
            rows="4"
            placeholder="Mô tả về không gian, giờ giấc, quy định..."
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          ></textarea>
        </div>
      </div>

      <div
        class="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-100"
      >
        <h2
          class="text-lg font-bold text-gray-800 mb-6 flex items-center border-b pb-2"
        >
          <span class="w-1 h-6 bg-green-600 mr-3 rounded"></span> Địa chỉ
        </h2>

        <!-- Hàng 1: Tỉnh + Phường -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Tỉnh / Thành phố
            </label>
            <select
              id="province-select"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
            >
              <option value="">-- Chọn Tỉnh --</option>
              <option
                th:each="p : ${provinces}"
                th:value="${p.code}"
                th:text="${p.name}"
              ></option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              Phường / Xã
            </label>
            <select
              th:field="*{wardCode}"
              id="ward-select"
              disabled
              class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 focus:ring-2 focus:ring-blue-500 disabled:cursor-not-allowed"
            >
              <option value="">-- Chọn Phường --</option>
            </select>
          </div>
        </div>

        <!-- Hàng 2: Địa chỉ chi tiết -->
        <div class="mt-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Số nhà, Tên đường
          </label>
          <input
            type="text"
            th:field="*{addressNumber}"
            placeholder="Ví dụ: 341 Bùi Minh Trực"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
          />
        </div>
      </div>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
      <div class="mb-8">
        <h3 class="text-lg font-bold text-gray-800 mb-4">Đối tượng</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div
            th:each="target : ${targetTenants}"
            class="flex items-center space-x-3 p-2 hover:bg-gray-50 rounded"
          >
            <input
              type="checkbox"
              th:value="${target.id}"
              th:field="*{targetIds}"
              class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500"
            />
            <label class="text-sm text-gray-700 flex items-center">
              <i th:class="${target.icon} + ' mr-2 text-blue-500'"></i>
              <span th:text="${target.name}">Wifi</span>
            </label>
          </div>
        </div>
      </div>

      <div class="mb-8">
        <h3 class="text-lg font-bold text-gray-800 mb-4">Tiện nghi</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div
            th:each="amenity : ${amenities}"
            class="flex items-center space-x-3 p-2 hover:bg-gray-50 rounded"
          >
            <input
              type="checkbox"
              th:value="${amenity.id}"
              th:field="*{amenityIds}"
              class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500"
            />
            <label class="text-sm text-gray-700 flex items-center">
              <i th:class="${amenity.icon} + ' mr-2 text-blue-500'"></i>
              <span th:text="${amenity.name}">Wifi</span>
            </label>
          </div>
        </div>
      </div>

      <div>
        <h3 class="text-lg font-bold text-gray-800 mb-4">
          Môi trường xung quanh
        </h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div
            th:each="sur : ${surroundings}"
            class="flex items-center space-x-3 p-2 hover:bg-gray-50 rounded"
          >
            <input
              type="checkbox"
              th:value="${sur.id}"
              th:field="*{surroundingIds}"
              class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500"
            />
            <label class="text-sm text-gray-700 flex items-center">
              <i th:class="${sur.icon} + ' mr-2 text-green-500'"></i>
              <span th:text="${sur.name}">Chợ</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div
      class="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-100"
    >
      <h2
        class="text-lg font-bold text-gray-800 mb-6 flex items-center border-b pb-2"
      >
        <span class="w-1 h-6 bg-purple-600 mr-3 rounded"></span> Hình ảnh &
        Video
      </h2>

      <div class="space-y-4">
        <div
          class="bg-blue-50 text-blue-700 px-4 py-3 rounded-lg text-sm flex items-start"
        >
          <i class="fa-solid fa-circle-info mt-0.5 mr-2"></i>
          <span>
            Lưu ý: Ảnh đầu tiên sẽ được chọn làm
            <strong>Ảnh bìa</strong> (Avatar) của bài đăng. Hãy chọn ảnh đẹp
            nhất!
          </span>
        </div>

        <div id="image-inputs-container" class="space-y-3">
          <div class="relative">
            <label
              class="absolute -top-2 left-3 bg-white px-1 text-xs font-semibold text-purple-600"
              >Ảnh bìa</label
            >
            <input
              type="text"
              name="imageUrls"
              placeholder="Dán đường dẫn ảnh vào đây (Ví dụ: https://imgur.com/...)"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all shadow-sm"
            />
          </div>
        </div>

        <button
          type="button"
          onclick="addImageInput()"
          class="w-full py-3 border-2 border-dashed border-gray-300 rounded-lg text-gray-500 font-semibold hover:border-purple-500 hover:text-purple-600 hover:bg-purple-50 transition-all flex items-center justify-center group"
        >
          <i
            class="fa-solid fa-plus mr-2 group-hover:rotate-90 transition-transform duration-300"
          ></i>
          Thêm ảnh khác
        </button>
      </div>
    </div>

    <div class="flex justify-end space-x-4">
      <a
        th:href="@{/owner/properties}"
        type="button"
        class="px-6 py-2 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-50 transition"
      >
        Hủy bỏ
      </a>
      <button
        type="submit"
        class="px-10 py-2 bg-orange-500 text-white font-bold rounded-md hover:bg-orange-600 shadow-md transition"
      >
        TIẾP TỤC
      </button>
    </div>
  </form>
</div>

<script>
  /* --- 1. XỬ LÝ DROPDOWN TỈNH/HUYỆN --- */
  const provinceSelect = document.getElementById("province-select");
  const wardSelect = document.getElementById("ward-select");

  if (provinceSelect) {
    provinceSelect.addEventListener("change", function () {
      const provinceCode = this.value;
      wardSelect.innerHTML = '<option value="">-- Chọn Phường --</option>';

      if (provinceCode) {
        wardSelect.disabled = false;
        wardSelect.classList.remove("bg-gray-100", "cursor-not-allowed");

        fetch(`/api/locations/wards/${provinceCode}`)
          .then((response) => response.json())
          .then((data) => {
            data.forEach((ward) => {
              const option = document.createElement("option");
              option.value = ward.code;
              option.text = ward.name;
              wardSelect.appendChild(option);
              console.log(option);
            });
          })
          .catch((error) => console.error("Error loading wards:", error));
      } else {
        wardSelect.disabled = true;
        wardSelect.classList.add("bg-gray-100", "cursor-not-allowed");
      }
    });
  }

  /* --- 2. XỬ LÝ THÊM/XÓA Ô INPUT ẢNH --- */
  function addImageInput() {
    const container = document.getElementById("image-inputs-container");

    // Tạo thẻ div bao ngoài
    const wrapper = document.createElement("div");
    wrapper.className = "flex items-center space-x-2 animate-fade-in-down"; // animate cho mượt

    // Nội dung HTML của dòng mới (Input + Nút Xóa)
    wrapper.innerHTML = `
            <div class="relative w-full">
                <input type="text" name="imageUrls" placeholder="Dán đường dẫn ảnh phụ..."
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 shadow-sm">
            </div>
            <button type="button" onclick="this.closest('div.flex').remove()"
                    class="p-3 text-red-500 bg-red-50 hover:bg-red-100 rounded-lg transition-colors border border-red-200" title="Xóa ảnh này">
                <i class="fa-solid fa-trash"></i>
            </button>
        `;

    container.appendChild(wrapper);
  }
</script>

<style>
  @keyframes fadeInDown {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fade-in-down {
    animation: fadeInDown 0.3s ease-out;
  }
</style>
