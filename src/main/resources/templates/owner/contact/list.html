<div th:fragment="content">
  <div
    class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8"
  >
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Danh sách liên hệ</h1>
      <p class="text-sm text-gray-500">
        Tổng cộng:
        <span class="font-semibold text-blue-600" th:text="${contacts.size()}"
          >0</span
        >
        yêu cầu hỗ trợ
      </p>
    </div>
  </div>

  <div
    class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"
  >
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead class="bg-gray-50/50 border-b border-gray-100">
          <tr class="text-gray-500 uppercase text-[11px] tracking-wider">
            <th class="px-6 py-4 font-bold">Họ và tên</th>
            <th class="px-6 py-4 font-bold">Quan tâm đến</th>
            <th class="px-6 py-4 font-bold">Số điện thoại</th>
            <th class="px-6 py-4 font-bold">Ghi chú</th>
            <th class="px-6 py-4 font-bold text-center">Trạng thái</th>
            <th class="px-6 py-4 font-bold text-center">Hành động</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-gray-50">
          <tr
            th:each="contact : ${contacts}"
            class="hover:bg-blue-50/30 transition-colors group"
          >
            <td class="px-6 py-4">
              <div class="font-bold text-gray-900" th:text="${contact.name}">
                Nguyễn Văn A
              </div>
            </td>

            <td class="px-6 py-4">
              <a
                th:href="@{/public/property/{slug}(slug=${contact.propertySlug})}"
                target="_blank"
                class="font-medium text-blue-600 hover:underline truncate max-w-[200px] block"
                th:text="${contact.propertyTitle}"
                >Nhà trọ giá rẻ</a
              >
            </td>

            <td class="px-6 py-4">
              <a
                th:href="'tel:' + ${contact.phone}"
                class="text-blue-600 hover:underline"
                th:text="${contact.phone}"
                >0909000111</a
              >
            </td>

            <td class="px-6 py-4">
              <span class="text-gray-600" th:text="${contact.note}"
                >Cần xem phòng gấp...</span
              >
            </td>

            <td class="px-6 py-4 text-center">
              <span
                th:if="${contact.isChecked}"
                class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-green-50 text-green-600 border border-green-100"
              >
                <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
                Đã liên hệ
              </span>
              <span
                th:unless="${contact.isChecked}"
                class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-yellow-50 text-yellow-600 border border-yellow-100"
              >
                <span
                  class="w-1.5 h-1.5 rounded-full bg-yellow-500 animate-pulse"
                ></span>
                Chờ xử lý
              </span>
            </td>

            <td class="px-6 py-4 text-center space-x-2">
              <a
                th:href="'tel:' + ${contact.phone}"
                class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-blue-100 text-blue-600 hover:bg-blue-200 transition-colors"
                title="Gọi điện"
              >
                <i class="fa-solid fa-phone text-xs"></i>
              </a>

              <a
                th:href="@{/owner/contact/toggle/{id}(id=${contact.id})}"
                class="inline-flex items-center justify-center w-8 h-8 rounded-full transition-colors"
                th:classappend="${contact.isChecked} ? 'bg-gray-100 text-gray-500 hover:bg-gray-200' : 'bg-green-100 text-green-600 hover:bg-green-200'"
                th:title="${contact.isChecked} ? 'Đánh dấu chưa xử lý' : 'Đánh dấu đã liên hệ'"
              >
                <i
                  class="fa-solid"
                  th:classappend="${contact.isChecked} ? 'fa-rotate-left' : 'fa-check'"
                ></i>
              </a>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(contacts)}">
            <td colspan="6" class="py-20 text-center">
              <div class="flex flex-col items-center">
                <div
                  class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-4"
                >
                  <i
                    class="fa-regular fa-address-book text-2xl text-gray-300"
                  ></i>
                </div>
                <h3 class="text-gray-900 font-semibold">Chưa có liên hệ nào</h3>
                <p class="text-gray-400 text-sm mt-1">
                  Các yêu cầu liên hệ từ khách hàng sẽ hiển thị ở đây.
                </p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
