<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Properties page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-gray-50 min-h-screen">

<nav class="bg-white shadow-sm mb-8">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <a th:href="@{/owner}" class="text-xl font-bold text-blue-600">Owner Dashboard</a>
        <div class="flex items-center gap-4">
            <span class="text-gray-600" th:text="${session.user.fullName}">Chủ nhà</span>
            <a th:href="@{/logout}" class="text-sm text-red-500 hover:underline">Đăng xuất</a>
        </div>
    </div>
</nav>

<div class="max-w-7xl mx-auto px-4">
    <div class="flex justify-between items-end mb-6">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">Danh sách tài sản</h1>
            <p class="text-gray-500">Bạn đang có <span th:text="${properties.size()}">0</span> bài đăng</p>
        </div>
        <a th:href="@{/owner/properties/create}"
           class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition duration-200">
            + Thêm tài sản mới
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-md overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead class="bg-gray-100 border-b border-gray-200">
            <tr>
                <th class="p-4 font-semibold text-gray-700">Tên tài sản</th>
                <th class="p-4 font-semibold text-gray-700">Địa chỉ</th>
                <th class="p-4 font-semibold text-gray-700">Loại</th>
                <th class="p-4 font-semibold text-gray-700">Ngày đăng</th>
                <th class="p-4 font-semibold text-gray-700 text-center">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="prop : ${properties}" class="border-b hover:bg-gray-50 transition">
                <td class="p-4 font-medium text-gray-800" th:text="${prop.name}">Tên nhà trọ</td>
                <td class="p-4 text-gray-600" th:text="${prop.addressNumber}">Số nhà</td>
                <td class="p-4 text-gray-600" th:text="${prop.categoryName}">Loại</td>
                <td class="p-4 italic text-sm text-gray-500" th:text="${prop.formattedCreatedAt}">slug-duong-dan</td>
                <td class="p-4 text-center">
                    <div class="flex justify-center gap-3">
                        <a th:href="@{/owner/properties/edit/{id}(id=${prop.id})}" class="text-blue-600 hover:text-blue-800">Sửa</a>
                        <form th:action="@{/owner/properties/delete/{id}(id=${prop.id})}" method="post" onsubmit="return confirm('Xác nhận xóa?')">
                            <button type="submit" class="text-red-500 hover:text-red-700">Xóa</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(properties)}">
                <td colspan="4" class="p-8 text-center text-gray-400">Bạn chưa có bài đăng nào. Hãy thêm mới ngay!</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
