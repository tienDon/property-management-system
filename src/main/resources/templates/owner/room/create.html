<div th:fragment="content" class="bg-gray-50 min-h-screen py-8">
  <div class="max-w-4xl mx-auto">
    <form
      th:action="@{/owner/rooms/create}"
      th:object="${roomRequest}"
      method="POST"
      class="bg-white p-8 rounded-xl shadow-sm border border-gray-100"
    >
      <div
        class="flex justify-between items-center mb-8 pb-4 border-b border-gray-100"
      >
        <h2
          class="text-xl font-bold text-gray-800 uppercase tracking-wide flex items-center gap-3"
        >
          <span class="w-1.5 h-6 bg-blue-600 rounded-full"></span>
          Thêm Phòng Mới
        </h2>
        <a
          th:href="@{/owner/rooms}"
          class="text-gray-500 hover:text-gray-700 text-sm font-medium transition-colors"
        >
          <i class="fa-solid fa-arrow-left mr-1"></i> Quay lại
        </a>
      </div>

      <div class="space-y-8">
        <!-- Thông tin cơ bản -->
        <div>
          <h3
            class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2"
          >
            <i class="fa-solid fa-info-circle text-blue-500"></i> Thông tin cơ
            bản
          </h3>
          <p class="text-sm text-gray-500 mb-4 -mt-2">
            Các thông tin cơ bản của phòng trọ
          </p>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="md:col-span-2">
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Nhà trọ <span class="text-red-500">*</span></label
              >
              <select
                th:field="*{propertyId}"
                id="propertySelect"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white"
                onchange="fetchServices()"
              >
                <option value="" disabled selected>-- Chọn nhà trọ --</option>
                <option
                  th:each="p : ${properties}"
                  th:value="${p.id}"
                  th:text="${p.name}"
                ></option>
              </select>
            </div>

            <div class="md:col-span-2">
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Tên phòng <span class="text-red-500">*</span></label
              >
              <input
                type="text"
                th:field="*{name}"
                placeholder="Nhập tên phòng (P.101, Phòng 1, ...)"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
              />
            </div>

            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Giá thuê <span class="text-red-500">*</span></label
              >
              <input
                type="number"
                th:field="*{price}"
                placeholder="Nhập giá thuê"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
              />
            </div>

            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Giá cọc</label
              >
              <input
                type="number"
                th:field="*{deposit}"
                placeholder="Giá cọc"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
              />
            </div>

            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Diện tích (m²)<span class="text-red-500">*</span></label
              >
              <input
                type="number"
                step="0.1"
                th:field="*{area}"
                placeholder="Nhập diện tích"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
              />
            </div>

            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Số người ở tối đa <span class="text-red-500">*</span></label
              >
              <input
                type="number"
                th:field="*{maxOccupancy}"
                placeholder="Nhập số người tối đa"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
              />
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Số giường</label
              >
              <input
                type="number"
                th:field="*{bedCount}"
                placeholder="Nhập số lượng giường"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
              />
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Chu kỳ thu tiền <span class="text-red-500">*</span></label
              >
              <select
                th:field="*{paymentCycle}"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white"
              >
                <option value="1">1 tháng</option>
                <option value="2">2 tháng</option>
                <option value="3">3 tháng</option>
                <option value="6">6 tháng</option>
                <option value="12">12 tháng</option>
              </select>
            </div>
          </div>
        </div>

        <div class="pt-4 pb-2">
          <h4 class="text-sm font-bold text-gray-700 mb-3">
            Giá thuê đã bao gồm điện nước?
          </h4>
          <div class="flex items-center gap-6">
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="radio"
                th:field="*{isElectricityWaterIncluded}"
                value="true"
                class="w-5 h-5 text-blue-600 focus:ring-blue-500 border-gray-300"
              />
              <span class="text-gray-700">Có (Đã bao gồm)</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="radio"
                th:field="*{isElectricityWaterIncluded}"
                value="false"
                class="w-5 h-5 text-blue-600 focus:ring-blue-500 border-gray-300"
              />
              <span class="text-gray-700">Không (Tính theo công tơ)</span>
            </label>
          </div>
        </div>

        <hr class="border-gray-100" />

        <!-- Dịch vụ -->
        <div>
          <h3
            class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2"
          >
            <i class="fa-solid fa-bell-concierge text-orange-500"></i> Dịch vụ
            sử dụng
          </h3>
          <p class="text-sm text-gray-500 mb-4 -mt-2">
            Thông tin phí và dịch vụ sử dụng của phòng (Chọn nhà trọ để tải danh
            sách dịch vụ)
          </p>

          <div
            id="services-container"
            class="bg-gray-50 p-6 rounded-lg text-center border border-dashed border-gray-300"
          >
            <span class="text-gray-500"
              >Vui lòng chọn Nhà trọ để xem các dịch vụ khả dụng.</span
            >
          </div>
        </div>

        <hr class="border-gray-100" />

        <!-- Note -->
        <div>
          <h3 class="text-lg font-semibold text-gray-700 mb-4">Ghi chú</h3>
          <textarea
            th:field="*{description}"
            rows="3"
            placeholder="Nhập ghi chú phòng..."
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
          ></textarea>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-end gap-4 mt-8 pt-6 border-t border-gray-100">
        <a
          th:href="@{/owner/rooms}"
          class="px-6 py-3 bg-white border border-gray-300 text-gray-700 font-bold rounded-lg hover:bg-gray-50 transition-colors"
        >
          Hủy bỏ
        </a>
        <button
          type="submit"
          class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-lg shadow-blue-200 transition-all flex items-center gap-2"
        >
          <i class="fa-solid fa-save"></i> Lưu thông tin
        </button>
      </div>
    </form>
  </div>
  <script th:inline="javascript">
    function fetchServices() {
      const propertyId = document.getElementById("propertySelect").value;
      const container = document.getElementById("services-container");

      if (!propertyId) {
        container.innerHTML =
          '<span class="text-gray-500">Vui lòng chọn Nhà trọ để xem các dịch vụ khả dụng.</span>';
        return;
      }

      container.innerHTML =
        '<span class="text-blue-500"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dịch vụ...</span>';

      console.log("Fetching services for property:", propertyId);

      fetch(`/owner/rooms/api/properties/${propertyId}/services`)
        .then((response) => {
          if (!response.ok) {
            throw new Error("Network response was not ok");
          }
          return response.json();
        })
        .then((data) => {
          console.log("Services loaded:", data);
          if (data.length === 0) {
            container.innerHTML = `
                        <div class="text-gray-500 py-4">
                            Hiện chưa có dịch vụ nào cho nhà trọ này.
                             <a href="/owner/services/create" class="text-blue-600 hover:underline ml-1">+ Thêm dịch vụ</a>
                        </div>
                     `;
          } else {
            let html =
              '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left">';
            data.forEach((service) => {
              html += `
                            <label class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg bg-white hover:bg-blue-50 cursor-pointer transition-colors shadow-sm">
                                <input type="checkbox" name="serviceIds" value="${service.id}" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                                <div>
                                    <p class="font-bold text-gray-800">${service.name}</p>
                                    <p class="text-xs text-gray-500">
                                        ${new Intl.NumberFormat("vi-VN", { style: "currency", currency: "VND" }).format(service.price)} / ${service.unit}
                                        <span class="ml-1 inline-block px-1.5 rounded-sm text-[10px] ${service.type === "FIXED" ? "bg-orange-100 text-orange-700" : "bg-purple-100 text-purple-700"}">${service.type === "FIXED" ? "Cố định" : "Theo chỉ số"}</span>
                                    </p>
                                </div>
                            </label>
                        `;
            });
            html += "</div>";
            // Add hint text similar to image
            html +=
              '<p class="text-xs text-gray-400 mt-2 text-center italic">Vui lòng tích chọn các dịch vụ sẽ áp dụng cho phòng này</p>';
            container.innerHTML = html;
          }
        })
        .catch((error) => {
          console.error("Error:", error);
          container.innerHTML =
            '<span class="text-red-500">Có lỗi xảy ra khi tải danh sách dịch vụ.</span>';
        });
    }
  </script>
</div>
