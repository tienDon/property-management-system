<div th:fragment="content" class="bg-gray-50 min-h-screen py-8">
  <div class="max-w-4xl mx-auto">
    <form
      th:action="@{/owner/tenants/create}"
      th:object="${tenantRequest}"
      method="POST"
      class="bg-white p-8 rounded-xl shadow-sm border border-gray-100"
    >
      <div
        class="flex justify-between items-center mb-8 pb-4 border-b border-gray-100"
      >
        <h2
          class="text-xl font-bold text-gray-800 uppercase tracking-wide flex items-center gap-3"
        >
          <span class="w-1.5 h-6 bg-blue-600 rounded-full"></span>
          Thêm Khách Thuê Mới
        </h2>
        <a
          th:href="@{/owner/tenants}"
          class="text-gray-500 hover:text-gray-700 text-sm font-medium transition-colors"
        >
          <i class="fa-solid fa-arrow-left mr-1"></i> Quay lại
        </a>
      </div>

      <div class="space-y-8">
        <!-- Nhóm 1: Thông tin cá nhân -->
        <div>
          <h3
            class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2"
          >
            <i class="fa-solid fa-user-circle text-blue-500"></i> Thông tin cá
            nhân
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Họ và tên <span class="text-red-500">*</span></label
              >
              <input
                type="text"
                th:field="*{fullName}"
                placeholder="Nhập họ tên đầy đủ"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
              />
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Giới tính <span class="text-red-500">*</span></label
              >
              <select
                th:field="*{gender}"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white"
              >
                <option value="MALE">Nam</option>
                <option value="FEMALE">Nữ</option>
                <option value="OTHER">Khác</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Ngày sinh <span class="text-red-500">*</span></label
              >
              <input
                type="date"
                th:field="*{birthday}"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
              />
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Nghề nghiệp</label
              >
              <input
                type="text"
                th:field="*{career}"
                placeholder="Sinh viên, Nhân viên văn phòng..."
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
              />
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Số điện thoại <span class="text-red-500">*</span></label
              >
              <input
                type="tel"
                th:field="*{phone}"
                placeholder="Ví dụ: 0987654321"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
              />
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Email</label
              >
              <input
                type="email"
                th:field="*{email}"
                placeholder="example@email.com"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
              />
            </div>
          </div>
        </div>

        <hr class="border-gray-100" />

        <!-- Nhóm 2: Thông tin định danh -->
        <div>
          <h3
            class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2"
          >
            <i class="fa-solid fa-id-card text-green-500"></i> Giấy tờ tùy thân
            (CCCD/CMND)
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="md:col-span-2">
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Số CCCD/CMND <span class="text-red-500">*</span></label
              >
              <input
                type="text"
                th:field="*{citizenId}"
                placeholder="Nhập số CCCD/CMND"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm uppercase"
              />
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Ngày cấp <span class="text-red-500">*</span></label
              >
              <input
                type="date"
                th:field="*{issueDate}"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
              />
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Nơi cấp <span class="text-red-500">*</span></label
              >
              <input
                type="text"
                th:field="*{placeOfIssue}"
                placeholder="Ví dụ: Cục CS QLHC về TTXH"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
              />
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-bold text-gray-700 mb-2"
                >Địa chỉ thường trú <span class="text-red-500">*</span></label
              >
              <textarea
                th:field="*{permanentAddress}"
                rows="2"
                placeholder="Nhập địa chỉ theo hộ khẩu..."
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
              ></textarea>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-end gap-4 mt-8 pt-6 border-t border-gray-100">
        <a
          th:href="@{/owner/tenants}"
          class="px-6 py-3 bg-white border border-gray-300 text-gray-700 font-bold rounded-lg hover:bg-gray-50 transition-colors"
        >
          Hủy bỏ
        </a>
        <button
          type="submit"
          class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-lg shadow-blue-200 transition-all flex items-center gap-2"
        >
          <i class="fa-solid fa-save"></i> Lưu hồ sơ
        </button>
      </div>
    </form>
  </div>
</div>
