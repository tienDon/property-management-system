<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title} ?: 'Quản lý - Trọ Mới'"></title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <style>
      /* Tông màu chủ đạo của tromoi.com */
      :root {
        --tm-blue: #0054a5;
        --tm-orange: #ff7b00;
      }
      .text-tm-blue {
        color: var(--tm-blue);
      }
      .bg-tm-blue {
        background-color: var(--tm-blue);
      }
      .bg-tm-orange {
        background-color: var(--tm-orange);
      }
    </style>
  </head>

  <body class="bg-gray-50 text-gray-800" x-data="{ sidebarOpen: true }">
    <div class="flex min-h-screen">
      <aside
        x-show="sidebarOpen"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="-translate-x-full opacity-0"
        x-transition:enter-end="translate-x-0 opacity-100"
        x-transition:leave="transition ease-in duration-300"
        x-transition:leave-start="translate-x-0 opacity-100"
        x-transition:leave-end="-translate-x-full opacity-0"
        class="w-64 bg-white border-r border-gray-200 flex flex-col sticky top-0 h-screen overflow-y-auto"
      >
        <div th:replace="~{layout/owner-sidebar :: sidebar}"></div>
      </aside>

      <div class="flex-1 flex flex-col">
        <header th:replace="~{layout/owner-header :: header}"></header>

        <main class="flex-1 p-6">
          <div th:replace="${content}"></div>
        </main>

        <footer
          class="p-4 text-xs text-gray-400 border-t border-gray-100 bg-white"
        >
          Copyright © 2015 - 2026 OHI Co.Ltd | Hệ thống được xây dựng bởi
          <span class="font-bold">OHI Co.Ltd</span>
        </footer>
      </div>
    </div>
  </body>
</html>
