<div th:fragment="sidebar" class="flex flex-col h-full">
  <a th:href="@{/}" class="block">
    <div class="flex items-center space-x-2 cursor-pointer">
      <i class="fa-brands fa-aws text-2xl text-blue-700"></i>
      <span class="font-bold text-blue-700 text-2xl uppercase"> Trọ Mới </span>
    </div>
  </a>

  <nav class="flex-1 px-4 py-4 space-y-1">
    <a
      href="/owner"
      class="flex items-center gap-3 p-3 rounded-lg text-gray-600 hover:bg-blue-50 hover:text-tm-blue transition"
    >
      <i class="fa-solid fa-chart-pie w-5"></i>
      <span
        class="font-medium"
        th:classappend="${#strings.isEmpty(activeMenu)}?'text-blue-500 font-semibold':''"
        >Tổng quan</span
      >
    </a>

    <a
      href="/owner/management-plans"
      class="flex items-center gap-3 p-3 rounded-lg text-gray-600 hover:bg-blue-50 hover:text-tm-blue transition"
      th:classappend="${activeMenu == 'management-plans'} ? 'bg-blue-50 text-tm-blue' : ''"
    >
      <i class="fa-solid fa-layer-group w-5"></i>
      <span
        class="font-medium"
        th:classappend="${activeMenu == 'management-plans'} ? 'text-blue-500 font-semibold' : ''"
        >Gói quản lý</span
      >
    </a>

    <a
      href="/owner/wallet"
      class="flex items-center gap-3 p-3 rounded-lg text-gray-600 hover:bg-blue-50 hover:text-tm-blue transition"
      th:classappend="${activeMenu == 'wallet'} ? 'bg-blue-50 text-tm-blue' : ''"
    >
      <i class="fa-solid fa-wallet w-5"></i>
      <span
        class="font-medium"
        th:classappend="${activeMenu == 'wallet'} ? 'text-blue-500 font-semibold' : ''"
        >Quản lý ví</span
      >
    </a>

    <div class="pt-2">
      <button
        class="w-full flex items-center justify-between p-3 text-tm-blue font-bold"
      >
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-house-chimney-user w-5"></i>
          <span>Quản lý cho thuê</span>
        </div>
        <i class="fa-solid fa-chevron-down text-xs"></i>
      </button>
      <div class="ml-11 space-y-1 mt-1">
        <a
          href="/owner/properties"
          class="block p-2 pl-4 hover:text-tm-blue"
          th:classappend="${activeMenu == 'properties'} ? ' text-blue-500 font-semibold' : ' text-gray-500'"
        >
          Nhà trọ
        </a>
        <a
          href="/owner/posts"
          class="block p-2 pl-4 hover:text-tm-blue"
          th:classappend="${activeMenu == 'posts'} ? ' text-blue-500 font-semibold' : ' text-gray-500'"
        >
          Bài đăng
        </a>
        <a
          href="/owner/rooms"
          class="block p-2 pl-4 hover:text-tm-blue"
          th:classappend="${activeMenu == 'rooms'} ? ' text-blue-500 font-semibold' : ' text-gray-500'"
          >Phòng</a
        >
        <a
          href="/owner/tenants"
          class="block p-2 pl-4 hover:text-tm-blue"
          th:classappend="${activeMenu == 'tenants'} ? ' text-blue-500 font-semibold' : ' text-gray-500'"
          >Khách thuê</a
        >
        <a
          href="/owner/contacts"
          class="block p-2 pl-4 hover:text-tm-blue"
          th:classappend="${activeMenu == 'contacts'} ? ' text-blue-500 font-semibold' : ' text-gray-500'"
          >Liên hệ</a
        >
        <a
          href="/owner/contracts"
          class="block p-2 pl-4 hover:text-tm-blue"
          th:classappend="${activeMenu == 'contracts'} ? ' text-blue-500 font-semibold' : ' text-gray-500'"
          >Hợp đồng</a
        >
        <a
          href="/owner/maintenance"
          class="block p-2 pl-4 hover:text-tm-blue"
          th:classappend="${activeMenu == 'maintenance'} ? ' text-blue-500 font-semibold' : ' text-gray-500'"
          >Bảo trì</a
        >
        <a href="#" class="block p-2 text-gray-500 hover:text-tm-blue pl-4"
          >Hóa đơn</a
        >
        <a href="#" class="block p-2 text-gray-500 hover:text-tm-blue pl-4"
          >Thu chi</a
        >
        <a
          href="/owner/services"
          class="block p-2 pl-4 hover:text-tm-blue"
          th:classappend="${activeMenu == 'services'} ? ' text-blue-500 font-semibold' : ' text-gray-500'"
          >Dịch vụ</a
        >
        <a href="#" class="block p-2 text-gray-500 hover:text-tm-blue pl-4"
          >Báo cáo</a
        >
      </div>
    </div>
  </nav>

  <div class="p-4 border-t border-gray-100 bg-gray-50">
    <p class="text-[10px] uppercase font-bold text-gray-400 mb-3">
      Nhân viên hỗ trợ
    </p>
    <div
      class="flex items-center gap-3 p-2 bg-white rounded-xl shadow-sm border border-blue-100"
    >
      <img
        src="https://tiendon.github.io/aws-worklog/images/avatar.png"
        class="w-10 h-10 rounded-full object-cover border border-blue-200"
      />
      <div>
        <p class="text-xs font-bold text-gray-700">Anonymous</p>
        <p class="text-[10px] text-blue-600">000000000</p>
      </div>
      <i class="fa-solid fa-comment-dots text-blue-500 ml-auto"></i>
    </div>
    <div class="mt-4 flex items-center gap-2 text-tm-blue">
      <i class="fa-solid fa-phone-volume animate-pulse"></i>
      <span class="text-xs font-bold">000.000.0000</span>
    </div>
  </div>
</div>
