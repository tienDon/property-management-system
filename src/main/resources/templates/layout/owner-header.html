<header
  th:fragment="header"
  class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center sticky top-0 z-40 shadow-sm"
>
  <!-- Wallet Balance Display -->
  <div
    class="flex items-center bg-green-50 border border-green-200 rounded-lg px-4 py-2 shadow-sm"
  >
    <i class="fa-solid fa-wallet text-green-600 mr-2"></i>
    <div class="flex flex-col">
      <span class="text-xs text-green-700 font-medium">Số dư ví</span>
      <span
        th:text="${#numbers.formatDecimal(session?.userWallet?.balance ?: 0, 0, 'COMMA', 0, 'POINT')} + ' đ'"
        class="text-lg font-bold text-green-800"
      >
        0 đ
      </span>
    </div>
  </div>

  <!-- Navigation to Packages -->
  <div class="flex items-center gap-4">
    <a
      href="/owner/management-plans"
      class="flex items-center gap-2 bg-orange-500 hover:bg-orange-600 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow-sm transition"
    >
      <i class="fa-solid fa-shopping-cart"></i>
      <span>Mua gói</span>
    </a>
  </div>

  <!-- Action Buttons and Profile -->
  <div class="flex items-center gap-3">
    <a
      href="/owner/wallet/topup"
      class="flex items-center gap-2 bg-tm-orange hover:opacity-90 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow-sm transition"
    >
      <i class="fa-solid fa-circle-dollar-to-slot"></i>
      <span>Nạp tiền</span>
    </a>

    <a
      href="/owner/wallet"
      class="flex items-center gap-2 bg-blue-50 text-tm-blue border border-blue-200 px-4 py-1.5 rounded-full text-sm font-bold hover:bg-blue-100 transition"
    >
      <i class="fa-solid fa-chart-line"></i>
      <span>Ví của tôi</span>
    </a>

    <div class="h-8 w-px bg-gray-200 mx-2"></div>

    <!-- User Profile Dropdown -->
    <div class="relative" x-data="{ isOpen: false }">
      <button
        @click="isOpen = !isOpen"
        class="flex items-center gap-2 group focus:outline-none"
      >
        <div
          class="w-9 h-9 bg-tm-blue text-white rounded-full flex items-center justify-center font-bold text-sm border-2 border-blue-100"
          th:text="${session.user?.fullName?.substring(0,1)?.toUpperCase() ?: 'U'}"
        >
          U
        </div>
        <i
          class="fa-solid fa-chevron-down text-[10px] text-gray-400 group-hover:text-tm-blue transition"
        ></i>
      </button>

      <!-- Dropdown Menu -->
      <div
        x-show="isOpen"
        @click.away="isOpen = false"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-75"
        x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-95"
        class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50"
        style="display: none"
      >
        <div class="px-4 py-2 border-b border-gray-100">
          <p
            class="text-sm font-medium text-gray-900"
            th:text="${session.user?.fullName}"
          >
            Tên người dùng
          </p>
          <p class="text-xs text-gray-500" th:text="${session.user?.email}">
            email@example.com
          </p>
        </div>
        <a
          href="/owner/profile"
          class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50"
        >
          <i class="fa-solid fa-user mr-2"></i>
          Hồ sơ cá nhân
        </a>
        <a
          href="/owner/wallet"
          class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50"
        >
          <i class="fa-solid fa-wallet mr-2"></i>
          Quản lý ví
        </a>
        <a
          href="/logout"
          class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50"
        >
          <i class="fa-solid fa-sign-out-alt mr-2"></i>
          Đăng xuất
        </a>
      </div>
    </div>
  </div>
</header>
