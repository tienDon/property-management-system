<a
  th:href="@{/public/property/{slug}(slug=${p.slug})}"
  th:fragment="card(p)"
  class="group block overflow-hidden rounded-[28px] border border-slate-200/80 bg-white shadow-[0_18px_50px_rgba(15,23,42,0.06)] transition duration-300 hover:-translate-y-1.5 hover:shadow-[0_24px_60px_rgba(14,165,233,0.14)]"
>
  <div class="flex flex-col md:flex-row">
    <div class="relative md:w-[38%]">
      <img
        th:src="${p.imageUrl}"
        th:alt="${p.title}"
        class="h-64 w-full object-cover transition duration-500 group-hover:scale-105 md:h-full"
      />
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950/55 via-transparent to-transparent"></div>
      <div class="absolute left-4 top-4 inline-flex items-center gap-2 rounded-full bg-white/90 px-3 py-1 text-xs font-bold text-slate-700 shadow-md">
        <i class="fa-solid fa-bolt text-amber-500"></i>
        Moi cap nhat
      </div>
      <div class="absolute bottom-4 left-4 rounded-full bg-slate-950/70 px-3 py-1 text-xs font-semibold text-white backdrop-blur">
        <span th:text="${p.categoryName}">Nha tro</span>
      </div>
    </div>

    <div class="flex flex-1 flex-col gap-5 p-5 md:p-6">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div class="space-y-3">
          <h3 class="text-xl font-extrabold leading-snug text-slate-900" th:text="${p.title}">Phong tro gan trung tam</h3>
          <p class="line-clamp-2 max-w-2xl text-sm leading-6 text-slate-500" th:text="${p.description}">
            Bai dang phong tro voi hinh anh ro rang, thong tin dia chi va gia thue minh bach.
          </p>
        </div>

        <div class="rounded-2xl bg-amber-50 px-4 py-3 text-right shadow-sm">
          <p class="text-[11px] font-bold uppercase tracking-[0.28em] text-amber-700">Gia tu</p>
          <p class="mt-1 text-xl font-extrabold text-amber-600" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT') + ' d/thang'}">3,000,000 d/thang</p>
        </div>
      </div>

      <div class="flex flex-wrap gap-3 text-sm">
        <span class="inline-flex items-center gap-2 rounded-full bg-sky-50 px-3 py-2 font-semibold text-sky-700">
          <i class="fa-regular fa-building"></i>
          <span th:text="${p.categoryName}">Can ho mini</span>
        </span>
        <span class="inline-flex items-center gap-2 rounded-full bg-emerald-50 px-3 py-2 font-semibold text-emerald-700">
          <i class="fa-solid fa-ruler-combined"></i>
          <span th:text="${p.acreage + ' m2'}">25 m2</span>
        </span>
        <span class="inline-flex items-center gap-2 rounded-full bg-violet-50 px-3 py-2 font-semibold text-violet-700">
          <i class="fa-solid fa-door-open"></i>
          <span th:text="${p.numberOfRooms > 0 ? p.numberOfRooms + ' phong' : 'Dang cap nhat'}">3 phong</span>
        </span>
      </div>

      <div class="mt-auto flex flex-col gap-4 border-t border-slate-100 pt-4 md:flex-row md:items-center md:justify-between">
        <div class="space-y-2 text-sm text-slate-500">
          <p class="flex items-start gap-2">
            <i class="fa-solid fa-location-dot mt-1 text-rose-500"></i>
            <span th:text="${p.addressNumber + ', ' + p.wardName + ', ' + p.provinceName}">Dia chi phong tro</span>
          </p>
          <p class="flex items-center gap-2">
            <i class="fa-regular fa-clock text-slate-400"></i>
            <span th:text="${p.formattedCreatedAt}">Moi dang hom nay</span>
          </p>
        </div>

        <span class="inline-flex items-center gap-2 self-start rounded-full bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition group-hover:bg-blue-700">
          Xem chi tiet
          <i class="fa-solid fa-arrow-right-long transition group-hover:translate-x-1"></i>
        </span>
      </div>
    </div>
  </div>
</a>
