<div th:fragment="search" class="max-w-6xl mx-auto px-4">
    <div class="bg-white p-2 rounded-lg shadow-lg flex flex-col md:flex-row gap-2">
        <div class="flex-1 flex items-center border rounded px-3 py-2 bg-gray-50">
            <i class="fa-solid fa-magnifying-glass text-gray-400 mr-2"></i>
            <input type="text" placeholder="Bạn muốn tìm trọ ở đâu?"
                   class="bg-transparent border-none outline-none w-full text-sm">
        </div>

        <div class="w-full md:w-48">
            <select class="w-full border rounded px-3 py-2 text-sm bg-gray-50 outline-none">
                <option value="">Nhà trọ, phòng trọ</option>
                <th:block th:each="cat : ${categories}">
                    <option th:if="${cat instanceof T(com.pms.propertymanagement.dto.response.CategoryResponse)}"
                            th:value="${cat.id}" th:text="${cat.name}"></option>
                </th:block>
            </select>
        </div>

        <div class="w-full md:w-48">
            <select class="w-full border rounded px-3 py-2 text-sm bg-gray-50 outline-none">
                <option value="">Mức giá</option>
                <option value="0-2">Dưới 2 triệu</option>
                <option value="2-5">2 - 5 triệu</option>
                <option value="5-10">5 - 10 triệu</option>
                <option value="10-100">Trên 10 triệu</option>
            </select>
        </div>

        <button class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded font-bold transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i>
            Tìm kiếm
        </button>
    </div>
</div>
