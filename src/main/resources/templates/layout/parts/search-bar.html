<div th:fragment="search" class="max-w-6xl mx-auto px-4">
    <form th:action="@{/public/search}" method="get" class="bg-white p-2 rounded-lg shadow-lg flex flex-col md:flex-row gap-2">
        <!-- Keyword / Khu vực (free text, có thể nhập tên đường/quận/tỉnh) -->
        <div class="flex-1 flex items-center border rounded px-3 py-2 bg-gray-50">
            <i class="fa-solid fa-magnifying-glass text-gray-400 mr-2"></i>
            <input type="text"
                   name="keyword"
                   th:value="${filter != null ? filter.keyword : ''}"
                   placeholder="Bạn muốn tìm trọ ở đâu? (địa chỉ, khu vực, từ khóa...)"
                   class="bg-transparent border-none outline-none w-full text-sm">
        </div>

        <!-- Loại nhà -->
        <div class="w-full md:w-48">
            <select name="categoryId"
                    class="w-full border rounded px-3 py-2 text-sm bg-gray-50 outline-none">
                <option value="">Tất cả loại nhà</option>
                <th:block th:each="cat : ${categories}">
                    <option th:value="${cat.id}"
                            th:selected="${filter != null and filter.categoryId == cat.id}"
                            th:text="${cat.name}"></option>
                </th:block>
            </select>
        </div>

        <!-- Giá cơ bản: một số range nhanh, map sang priceMin/priceMax ở backend (hoặc JS sau) -->
        <div class="w-full md:w-48">
            <select name="priceQuick"
                    class="w-full border rounded px-3 py-2 text-sm bg-gray-50 outline-none">
                <option value="">Mức giá</option>
                <option value="0-2000000">Dưới 2 triệu</option>
                <option value="2000000-5000000">2 - 5 triệu</option>
                <option value="5000000-10000000">5 - 10 triệu</option>
                <option value="10000000-0">Trên 10 triệu</option>
            </select>
        </div>

        <button type="submit"
                class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded font-bold transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i>
            Tìm kiếm
        </button>
    </form>
</div>
