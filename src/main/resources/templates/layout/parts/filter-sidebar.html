<div th:fragment="sidebar" class="space-y-6">
    <div class="bg-white p-4 rounded-lg border border-gray-200">
        <h3 class="font-bold text-gray-800 mb-4 flex justify-between items-center">
            Diện tích <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
        </h3>
        <div class="space-y-3">
            <label class="flex items-center gap-3 cursor-pointer group">
                <input type="radio" name="acreage" class="w-4 h-4 text-blue-600">
                <span class="text-sm text-gray-600 group-hover:text-blue-600">Dưới 20 m²</span>
            </label>
            <label class="flex items-center gap-3 cursor-pointer group">
                <input type="radio" name="acreage" class="w-4 h-4 text-blue-600">
                <span class="text-sm text-gray-600 group-hover:text-blue-600">20 - 40 m²</span>
            </label>
            <label class="flex items-center gap-3 cursor-pointer group">
                <input type="radio" name="acreage" class="w-4 h-4 text-blue-600">
                <span class="text-sm text-gray-600 group-hover:text-blue-600">Trên 40 m²</span>
            </label>
        </div>
    </div>

    <div class="bg-white p-4 rounded-lg border border-gray-200">
        <h3 class="font-bold text-gray-800 mb-4 flex justify-between items-center">
            Tiện nghi <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
        </h3>
        <div class="grid grid-cols-1 gap-3">
            <label th:each="amenity : ${allAmenities}" class="flex items-center gap-3 cursor-pointer group">
                <input type="checkbox" class="w-4 h-4 rounded text-blue-600 border-gray-300">
                <span class="text-sm text-gray-600 group-hover:text-blue-600" th:text="${amenity.name}">Wifi</span>
            </label>
        </div>
    </div>
</div>
