<header th:fragment="header-main" class="public-header sticky top-0 z-50 border-b border-white/60">
  <div class="container mx-auto px-4 md:px-6 lg:px-8">
    <div class="flex flex-col gap-4 py-4 lg:flex-row lg:items-center lg:justify-between">
      <div class="flex items-center justify-between gap-4">
        <a th:href="@{/}" class="flex items-center gap-3">
          <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-sky-500 to-blue-700 text-white shadow-lg shadow-sky-500/30">
            <i class="fa-solid fa-house-chimney-window text-lg"></i>
          </div>
          <div>
            <p class="text-xs font-semibold uppercase tracking-[0.3em] text-sky-700">PMS Marketplace</p>
            <p class="text-2xl font-extrabold tracking-tight text-slate-900">Trọ Mới</p>
          </div>
        </a>

        <a
          th:if="${session.user == null or (session.user.roles.?[name == 'OWNER'].size() == 0 and session.user.roles.?[name == 'STAFF'].size() == 0)}"
          href="/login/owner"
          class="inline-flex items-center gap-2 rounded-full bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition hover:-translate-y-0.5 hover:bg-blue-700 lg:hidden"
        >
          <i class="fa-solid fa-plus"></i>
          Đăng nhà trọ
        </a>
      </div>

      <nav class="hidden items-center gap-6 lg:flex">
        <th:block th:each="cat : ${categories}">
          <th:block th:if="${cat instanceof T(com.pms.propertymanagement.dto.response.CategoryResponse)}">
            <a
              th:href="@{/public/category/{id}(id=${cat.id})}"
              class="group relative text-sm font-semibold text-slate-700 transition hover:text-blue-700"
            >
              <span th:text="${cat.name}">Nha tro</span>
              <span class="absolute -bottom-2 left-0 h-0.5 w-full origin-left scale-x-0 rounded-full bg-gradient-to-r from-sky-500 to-blue-700 transition duration-300 group-hover:scale-x-100"></span>
            </a>
          </th:block>
        </th:block>
        <a href="/video-review" class="group relative text-sm font-semibold text-slate-700 transition hover:text-blue-700">
          Video review
          <span class="absolute -bottom-2 left-0 h-0.5 w-full origin-left scale-x-0 rounded-full bg-gradient-to-r from-amber-500 to-orange-500 transition duration-300 group-hover:scale-x-100"></span>
        </a>
      </nav>

      <div class="flex flex-wrap items-center gap-3">
        <div th:if="${session.user == null}" class="flex flex-wrap items-center gap-3">
          <a
            href="/login"
            class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white/90 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:border-sky-200 hover:text-blue-700"
          >
            <i class="fa-solid fa-right-to-bracket"></i>
            Đăng nhập
          </a>

          <a
            href="/register"
            class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white/90 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:border-sky-200 hover:text-blue-700"
          >
            <i class="fa-solid fa-user-plus"></i>
            Đăng ký
          </a>
        </div>

        <div th:if="${session.user != null}" class="flex flex-wrap items-center gap-3">
          <div class="rounded-full bg-white/90 px-4 py-2 text-sm text-slate-700 shadow-sm">
            Xin chào,
            <span class="font-semibold" th:text="${session.user.fullName != null ? session.user.fullName : session.user.username}">Người dùng</span>
          </div>

          <a
            th:if="${session.user.roles.?[name == 'OWNER'].size() > 0}"
            href="/owner"
            class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white/90 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-sky-200 hover:text-blue-700"
          >
            Quản lý
          </a>

          <a
            th:if="${session.user.roles.?[name == 'STAFF'].size() > 0}"
            href="/staff/maintenance"
            class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white/90 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-sky-200 hover:text-blue-700"
          >
            Công việc
          </a>

          <a
            th:if="${session.user.roles.?[name == 'OWNER'].size() == 0 and session.user.roles.?[name == 'STAFF'].size() == 0}"
            href="/tenant/rooms"
            class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white/90 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-sky-200 hover:text-blue-700"
          >
            Phòng của tôi
          </a>

          <form th:action="@{/logout}" method="post">
            <button
              type="submit"
              class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white/90 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-rose-200 hover:text-rose-600"
            >
              <i class="fa-solid fa-right-from-bracket"></i>
              Đăng xuất
            </button>
          </form>
        </div>

        <a
          th:if="${session.user == null or (session.user.roles.?[name == 'OWNER'].size() == 0 and session.user.roles.?[name == 'STAFF'].size() == 0)}"
          href="/login/owner"
          class="hidden items-center gap-2 rounded-full bg-gradient-to-r from-sky-500 to-blue-700 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-sky-500/30 transition hover:-translate-y-0.5 hover:shadow-xl hover:shadow-sky-500/40 lg:inline-flex"
        >
          <i class="fa-solid fa-building"></i>
          Đăng nhà trọ
        </a>
      </div>
    </div>

    <div class="no-scrollbar flex gap-3 overflow-x-auto pb-4 lg:hidden">
      <th:block th:each="cat : ${categories}">
        <th:block th:if="${cat instanceof T(com.pms.propertymanagement.dto.response.CategoryResponse)}">
          <a
            th:href="@{/public/category/{id}(id=${cat.id})}"
            class="whitespace-nowrap rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm"
            th:text="${cat.name}"
          >
            Nha tro
          </a>
        </th:block>
      </th:block>
      <a href="/video-review" class="whitespace-nowrap rounded-full border border-amber-200 bg-amber-50 px-4 py-2 text-sm font-semibold text-amber-700 shadow-sm">
        Video review
      </a>
    </div>
  </div>
</header>
