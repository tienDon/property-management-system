<header th:fragment="header"
        class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center sticky top-0 z-40 shadow-sm">

  <!-- Left: page context -->
  <div>
    <p class="text-xs text-gray-400 uppercase tracking-wider">Kiểm duyệt</p>
    <p class="text-base font-bold text-gray-800"
       th:text="${session.user?.fullName ?: 'Moderator'}"></p>
  </div>

  <!-- Right: actions -->
  <div class="flex items-center gap-3">

    <!-- Pending badge shortcut -->
    <a th:if="${pendingCount > 0}"
       href="/moderator/posts/pending"
       class="flex items-center gap-2 bg-orange-50 border border-orange-200 text-orange-700 px-4 py-1.5 rounded-full text-sm font-semibold hover:bg-orange-100 transition">
      <i class="fa-solid fa-clock"></i>
      <span th:text="${pendingCount} + ' chờ duyệt'"></span>
    </a>

    <!-- Re-review badge shortcut -->
    <a th:if="${reReviewCount > 0}"
       href="/moderator/posts/re-review"
       class="flex items-center gap-2 bg-blue-50 border border-blue-200 text-blue-700 px-4 py-1.5 rounded-full text-sm font-semibold hover:bg-blue-100 transition">
      <i class="fa-solid fa-rotate"></i>
      <span th:text="${reReviewCount} + ' duyệt lại'"></span>
    </a>

    <div class="h-8 w-px bg-gray-200"></div>

    <!-- User avatar + logout -->
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 bg-[#0054a5] text-white rounded-full flex items-center justify-center font-bold text-sm border-2 border-blue-100"
           th:text="${session.user?.fullName?.substring(0,1)?.toUpperCase() ?: 'M'}"></div>
      <a href="/logout"
         class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-red-500 transition">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Đăng xuất</span>
      </a>
    </div>

  </div>
</header>
