<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Trọ Mới</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col sticky top-0 h-screen">
            <div class="p-6 border-b border-gray-100 flex items-center gap-3">
                <i class="fa-solid fa-shield-halved text-blue-600 text-2xl"></i>
                <span class="text-xl font-bold text-gray-800">Admin</span>
            </div>
            <nav class="flex-1 p-4 space-y-1">
                <a href="/admin/dashboard" th:class="${content == 'admin/dashboard' ? 'flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg bg-blue-50 text-blue-700' : 'flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-600 hover:bg-gray-50 rounded-lg transition-colors'}">
                    <i class="fa-solid fa-chart-pie w-5"></i>
                    Thống kê
                </a>
                <a href="/admin/reviews" th:class="${content == 'admin/reviews-list' ? 'flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg bg-blue-50 text-blue-700' : 'flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-600 hover:bg-gray-50 rounded-lg transition-colors'}">
                    <i class="fa-solid fa-star-half-stroke w-5"></i>
                    Quản lý đánh giá
                </a>
            </nav>
            <div class="p-4 border-t border-gray-100">
                <a href="/logout" class="flex items-center gap-3 px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                    <i class="fa-solid fa-right-from-bracket w-5"></i>
                    Đăng xuất
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <header class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center shadow-sm">
                <h2 class="text-lg font-semibold text-gray-800">Tổng quan hệ thống</h2>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-500">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <span class="text-sm font-medium text-gray-700">Administrator</span>
                </div>
            </header>

            <main class="flex-1 p-8">
                <!-- Dynamic Content Injection -->
                <!-- Expects 'content' model attribute to be the template path, e.g. 'admin/dashboard' -->
                <!-- And that template must have a fragment named 'content' -->
                <div th:replace="~{${content} :: content}"></div>
            </main>
        </div>
    </div>
</body>
</html>
