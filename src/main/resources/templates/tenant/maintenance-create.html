<div>
    <a th:href="@{/tenant/rooms}" class="text-sm text-blue-600 hover:underline">&larr; Danh sách phòng</a>
    <h1 class="text-2xl font-semibold mt-2">Tạo yêu cầu bảo trì</h1>
    <div class="mt-2 text-gray-700">
        <span class="font-medium">Phòng:</span>
        <span th:text="${room.name}">Phòng</span>
    </div>
    <form th:action="@{|/tenant/rooms/${room.id}/maintenance/create|}" method="post" enctype="multipart/form-data"
        th:object="${maintenanceForm}" class="mt-4 space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">Danh mục</label>
            <select th:field="*{category}" class="w-full border rounded px-3 py-2">
                <option value="">-- Chọn danh mục --</option>
                <option th:each="c : ${maintenanceCategories}" th:value="${c}" th:text="${c.displayName}"></option>
            </select>
            <p class="text-red-600 text-sm mt-1" th:if="${errorCategory != null}" th:text="${errorCategory}"></p>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Mô tả</label>
            <textarea th:field="*{description}" rows="5" class="w-full border rounded px-3 py-2"></textarea>
            <p class="text-red-600 text-sm mt-1" th:if="${errorDescription != null}" th:text="${errorDescription}"></p>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Ảnh đính kèm <span class="text-gray-400 font-normal">(tùy
                    chọn)</span></label>
            <input type="file" name="image" accept="image/*" class="block w-full text-sm text-gray-700 border rounded px-3 py-2 cursor-pointer
                       file:mr-3 file:py-1 file:px-3 file:rounded file:border-0
                       file:text-sm file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
            <p class="text-gray-400 text-xs mt-1">Chấp nhận: JPG, PNG, GIF, BMP (tối đa 10 MB)</p>
        </div>
        <div class="flex gap-2">
            <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Gửi yêu
                cầu</button>
            <a th:href="@{|/tenant/rooms/${room.id}|}" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Hủy</a>
        </div>
    </form>
</div>
