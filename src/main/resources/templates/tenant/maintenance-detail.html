<div>
    <div class="flex flex-wrap items-center gap-3 text-sm">
        <a th:href="@{/tenant/rooms}" class="text-blue-600 hover:underline">&larr; Danh sách phòng</a>
        <a th:href="@{/tenant/maintenance}" class="text-blue-600 hover:underline">Danh sách yêu cầu</a>
    </div>
    <h1 class="text-2xl font-semibold mt-2">Chi tiết yêu cầu bảo trì</h1>

    <div th:if="${success}" class="mt-3 p-3 bg-green-100 text-green-800 rounded">
        Thao tác thành công.
    </div>
    <script th:if="${success}">
        (function () {
            alert('Cập nhật yêu cầu bảo trì thành công!');
            if (history.replaceState) {
                const url = new URL(window.location.href);
                url.searchParams.delete('success');
                history.replaceState(null, '', url.toString());
            }
        })();
    </script>

    <div class="mt-4 border rounded p-4 space-y-2">
        <p><span class="font-medium">Mã yêu cầu:</span> <span th:text="${request.code != null ? request.code : request.id}"></span></p>
        <p><span class="font-medium">Phòng:</span> <span th:text="${request.room.name}"></span></p>
        <p><span class="font-medium">Danh mục:</span> <span th:text="${request.category.displayName}"></span></p>
        <p><span class="font-medium">Mô tả:</span></p>
        <p class="text-gray-700 whitespace-pre-line" th:text="${request.description}"></p>
        <div class="flex items-center gap-2">
            <span class="font-medium">Trạng thái:</span>
            <span th:class="${request.status.name() == 'PENDING' ? 'bg-yellow-100 text-yellow-800' :
                             request.status.name() == 'ASSIGNED' ? 'bg-blue-100 text-blue-800' :
                             request.status.name() == 'IN_PROGRESS' ? 'bg-orange-100 text-orange-800' :
                             request.status.name() == 'COMPLETED' ? 'bg-green-100 text-green-800' :
                             request.status.name() == 'CONFIRMED' ? 'bg-gray-200 text-gray-800' :
                             request.status.name() == 'REJECTED' ? 'bg-red-100 text-red-800' :
                             request.status.name() == 'REOPENED' ? 'bg-purple-100 text-purple-800' : 'bg-gray-100 text-gray-800'} + ' px-2 py-1 rounded text-sm'"
                  th:text="${request.status.displayName}"></span>
        </div>
        <div th:if="${request.status.name() == 'REJECTED'}">
            <p><span class="font-medium">Lý do từ chối:</span> <span th:text="${request.rejectedReason}"></span></p>
        </div>
        <div th:if="${request.status.name() == 'REOPENED'}">
            <p><span class="font-medium">Lý do mở lại:</span> <span th:text="${request.reopenedReason}"></span></p>
        </div>
    </div>

    <div th:if="${request.status.name() == 'COMPLETED'}" class="mt-4 flex flex-col md:flex-row gap-4">
        <form th:action="@{|/tenant/maintenance/${request.id}/confirm|}" method="post">
            <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Xác nhận hoàn thành</button>
        </form>
        <form th:action="@{|/tenant/maintenance/${request.id}/reopen|}" method="post" class="flex-1">
            <div>
                <label class="block text-sm font-medium mb-1">Chưa xử lý xong - nhập lý do</label>
                <textarea name="reason" rows="3" class="w-full border rounded px-3 py-2"></textarea>
                <p class="text-red-600 text-sm mt-1" th:if="${errorReopen != null}" th:text="${errorReopen}"></p>
            </div>
            <button type="submit" class="mt-2 px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">Gửi yêu cầu làm lại</button>
        </form>
    </div>
</div>
