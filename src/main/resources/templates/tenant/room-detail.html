<div>
    <a href="/tenant/rooms" class="text-sm text-blue-600 hover:underline">&larr; Quay lại danh sách</a>
    <h1 class="text-2xl font-semibold mt-2" th:text="${room.name}">Chi tiết phòng</h1>
    <div th:if="${maintenanceError != null}" class="mt-3 p-3 bg-yellow-100 text-yellow-800 rounded" th:text="${maintenanceError}"></div>
    <div class="mt-3 border rounded p-4">
        <p><span class="font-medium">Tòa nhà:</span> <span th:text="${room.property != null ? room.property.name : 'N/A'}"></span></p>
        <p><span class="font-medium">Giá:</span> <span th:text="${#numbers.formatDecimal(room.price, 0, 'COMMA', 0, 'POINT')}"></span></p>
        <p><span class="font-medium">Trạng thái:</span> <span th:text="${room.status.displayName}"></span></p>
        <p class="mt-2"><span class="font-medium">Mô tả:</span></p>
        <p class="text-gray-700 whitespace-pre-line" th:text="${room.description}">Mô tả</p>
    </div>
    <div class="mt-4">
        <div th:if="${room.status.name() == 'AVAILABLE'}">
            <form th:action="@{|/tenant/rooms/${room.id}/rent|}" method="post">
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Thuê phòng này</button>
            </form>
        </div>
        <div th:if="${canRequestMaintenance}" class="flex flex-wrap gap-2">
            <a th:href="@{|/tenant/rooms/${room.id}/maintenance/create|}" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Yêu cầu bảo trì</a>
            <a th:href="@{/tenant/maintenance}" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Danh sách yêu cầu</a>
        </div>
        <div th:if="${canRequestMaintenance == false}" class="text-sm text-gray-600">
            Phòng này không thuộc danh sách phòng đang thuê của bạn.
        </div>
    </div>
</div>
