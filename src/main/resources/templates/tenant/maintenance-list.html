<div>
    <a th:href="@{/tenant/rooms}" class="text-sm text-blue-600 hover:underline">&larr; Danh sách phòng</a>
    <h1 class="text-2xl font-semibold mt-2">Yêu cầu bảo trì của bạn</h1>

    <div th:if="${success}" class="mt-3 p-3 bg-green-100 text-green-800 rounded">
        Thao tác thành công.
    </div>
    <script th:if="${success}">
        (function () {
            alert('Gửi yêu cầu bảo trì thành công!');
            if (history.replaceState) {
                const url = new URL(window.location.href);
                url.searchParams.delete('success');
                url.searchParams.delete('createdId');
                history.replaceState(null, '', url.toString());
            }
        })();
    </script>

    <div th:if="${#lists.isEmpty(requests)}" class="mt-4 p-4 border rounded text-gray-700">
        Chưa có yêu cầu bảo trì nào.
    </div>

    <div th:if="${!#lists.isEmpty(requests)}" class="mt-4 border rounded overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-700">
            <tr>
                <th class="text-left px-4 py-3">Mã</th>
                <th class="text-left px-4 py-3">Phòng</th>
                <th class="text-left px-4 py-3">Danh mục</th>
                <th class="text-left px-4 py-3">Trạng thái</th>
                <th class="text-left px-4 py-3">Ngày tạo</th>
                <th class="text-right px-4 py-3">Thao tác</th>
            </tr>
            </thead>
            <tbody class="divide-y">
            <tr th:each="r : ${requests}"
                th:class="${createdId != null and r.id == createdId} ? 'bg-green-50' : ''">
                <td class="px-4 py-3" th:text="${r.id}"></td>
                <td class="px-4 py-3" th:text="${r.room != null ? r.room.name : 'N/A'}"></td>
                <td class="px-4 py-3" th:text="${r.category.displayName}"></td>
                <td class="px-4 py-3">
                    <span th:class="${r.status.name() == 'PENDING' ? 'bg-yellow-100 text-yellow-800' :
                                     r.status.name() == 'ASSIGNED' ? 'bg-blue-100 text-blue-800' :
                                     r.status.name() == 'IN_PROGRESS' ? 'bg-orange-100 text-orange-800' :
                                     r.status.name() == 'COMPLETED' ? 'bg-green-100 text-green-800' :
                                     r.status.name() == 'CONFIRMED' ? 'bg-gray-200 text-gray-800' :
                                     r.status.name() == 'REJECTED' ? 'bg-red-100 text-red-800' :
                                     r.status.name() == 'REOPENED' ? 'bg-purple-100 text-purple-800' : 'bg-gray-100 text-gray-800'} + ' px-2 py-1 rounded text-xs font-semibold'"
                          th:text="${r.status.displayName}"></span>
                </td>
                <td class="px-4 py-3" th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td class="px-4 py-3 text-right">
                    <a th:href="@{|/tenant/maintenance/${r.id}|}" class="text-blue-600 hover:underline">Xem</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
