<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Homepage - Rooms</title>
    <meta charset="UTF-8" />

    <!-- ✅ Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">
<div class="max-w-6xl mx-auto px-4 py-6">

    <h2 class="text-2xl font-bold mb-5">Danh sách phòng</h2>

    <!-- ✅ FORM SEARCH -->
    <form method="get" th:action="@{/rooms/search}"
          class="bg-white border border-gray-200 rounded-2xl shadow-sm p-5 mb-6">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold">Tìm kiếm phòng</h3>

            <!-- ✅ Nút bỏ lọc -->
            <a th:href="@{/rooms}">
                <button type="button"
                        class="px-4 py-2 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 transition">
                    Bỏ lọc
                </button>
            </a>
        </div>

        <!-- ✅ Grid layout -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <!-- ✅ KHU VỰC -->
            <div class="bg-gray-50 border border-gray-200 rounded-xl p-4">
                <p class="font-medium mb-3">Chọn khu vực</p>

                <div class="space-y-3">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">Thành phố</label>
                        <select name="provinceCode" id="provinceSelect"
                                class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
                            <option value="">-- Chọn thành phố --</option>
                            <option th:each="p : ${provinces}"
                                    th:value="${p.code}"
                                    th:text="${p.name}"
                                    th:selected="${p.code == provinceCode}">
                            </option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm text-gray-600 mb-1">Quận</label>
                        <select name="districtCode" id="districtSelect"
                                class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
                            <option value="">-- Chọn quận --</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm text-gray-600 mb-1">Phường</label>
                        <select name="wardCode" id="wardSelect"
                                class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
                            <option value="">-- Chọn phường --</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- ✅ FILTER KHÁC -->
            <div class="bg-gray-50 border border-gray-200 rounded-xl p-4">
                <p class="font-medium mb-3">Bộ lọc</p>

                <!-- Category -->
                <div class="mb-3">
                    <label class="block text-sm text-gray-600 mb-1">Loại phòng</label>
                    <select name="categoryId"
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
                        <option value="">-- Chọn loại --</option>
                        <option th:each="c : ${categories}"
                                th:value="${c.id}"
                                th:text="${c.name}"
                                th:selected="${c.id == categoryId}">
                        </option>
                    </select>
                </div>

                <!-- Price -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">Giá từ</label>
                        <input type="number" name="minPrice" placeholder="VD: 1000000"
                               th:value="${minPrice}"
                               class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400"/>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">đến</label>
                        <input type="number" name="maxPrice" placeholder="VD: 3000000"
                               th:value="${maxPrice}"
                               class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400"/>
                    </div>
                </div>

                <!-- Area -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">Diện tích từ</label>
                        <input type="number" name="minArea" placeholder="VD: 15"
                               th:value="${minArea}"
                               class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400"/>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">đến</label>
                        <input type="number" name="maxArea" placeholder="VD: 35"
                               th:value="${maxArea}"
                               class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400"/>
                    </div>
                </div>
            </div>
        </div>

        <!-- ✅ ACTIONS -->
        <div class="mt-4 flex items-center gap-3">
            <button type="submit"
                    class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition shadow-sm">
                Tìm kiếm
            </button>

            <p class="text-sm text-gray-500">
                * Chọn điều kiện rồi bấm “Tìm kiếm”
            </p>
        </div>
    </form>


    <!-- ✅ LIST ROOMS -->
    <div th:if="${rooms == null || #lists.isEmpty(rooms)}"
         class="bg-white border border-gray-200 rounded-2xl shadow-sm p-6 text-center text-gray-500">
        Không có phòng nào.
    </div>

    <div th:each="room : ${rooms}"
         class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden mb-4 hover:shadow-md transition">

        <div class="flex flex-col md:flex-row">
            <!-- ✅ IMAGE -->
            <div class="md:w-[280px] h-[180px] bg-gray-100 flex items-center justify-center">
                <img th:if="${room.images != null && !#lists.isEmpty(room.images)}"
                     th:src="${room.images[0].imageUrl}"
                     alt="Room Image"
                     class="w-full h-full object-cover"/>

                <div th:if="${room.images == null || #lists.isEmpty(room.images)}"
                     class="text-gray-400 text-sm">
                    Chưa có ảnh
                </div>
            </div>

            <!-- ✅ INFO -->
            <div class="flex-1 p-4">
                <div class="flex items-start justify-between gap-3">
                    <h3 class="text-lg font-semibold"
                        th:text="'Room: ' + ${room.roomNumber}"></h3>

                    <span class="text-xs px-3 py-1 rounded-full bg-green-50 text-green-700 border border-green-200"
                          th:text="${room.status}">
                    </span>
                </div>

                <div class="mt-2 grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-gray-700">
                    <!-- ✅ FORMAT PRICE -->
                    <p th:text="'Giá: ' + ${#numbers.formatDecimal(room.price, 0, 'POINT', 0, 'COMMA')} + ' VND'"></p>

                    <!-- ✅ m² -->
                    <p th:text="'Diện tích: ' + ${#numbers.formatDecimal(room.area, 0, 'POINT', 0, 'COMMA')} + ' m²'"></p>

                    <p th:if="${room.property != null}"
                       th:text="'Nhà trọ: ' + ${room.property.name}"></p>

                    <p th:if="${room.category != null}"
                       th:text="'Loại: ' + ${room.category.name}"></p>
                </div>

                <p class="mt-2 text-sm text-gray-600"
                   th:if="${room.property != null && room.property.ward != null}">
                    <span th:text="'Phường: ' + ${room.property.ward.name}"></span>
                    <span th:if="${room.property.ward.district != null}"
                          th:text="' - Quận: ' + ${room.property.ward.district.name}"></span>
                    <span th:if="${room.property.ward.district != null && room.property.ward.district.province != null}"
                          th:text="' - Thành phố: ' + ${room.property.ward.district.province.name}"></span>
                </p>

                <div class="mt-4">
                    <a th:href="@{/rooms/detail/{id}(id=${room.id})}">
                        <button type="button"
                                class="px-4 py-2 rounded-lg border border-gray-300 bg-white hover:bg-gray-100 transition">
                            Xem chi tiết
                        </button>
                    </a>
                </div>
            </div>
        </div>
    </div>


</div>

<!-- ✅ SCRIPT load District/Ward + giữ lựa chọn -->
<script th:inline="javascript">
    const provinceSelect = document.getElementById("provinceSelect");
    const districtSelect = document.getElementById("districtSelect");
    const wardSelect = document.getElementById("wardSelect");

    // ✅ lấy giá trị cũ khi reload trang (từ controller trả về)
    const selectedDistrictCode = /*[[${districtCode}]]*/ "";
    const selectedWardCode = /*[[${wardCode}]]*/ "";

    async function loadDistricts(provinceId, selectedDistrict) {
        districtSelect.innerHTML = `<option value="">-- Chọn quận --</option>`;
        wardSelect.innerHTML = `<option value="">-- Chọn phường --</option>`;

        if (!provinceId) return;

        const res = await fetch(`/api/locations/districts?provinceId=${provinceId}`);
        const districts = await res.json();

        districts.forEach(d => {
            const isSelected = (d.code === selectedDistrict) ? "selected" : "";
            districtSelect.innerHTML += `<option value="${d.code}" ${isSelected}>${d.name}</option>`;
        });
    }

    async function loadWards(districtId, selectedWard) {
        wardSelect.innerHTML = `<option value="">-- Chọn phường --</option>`;

        if (!districtId) return;

        const res = await fetch(`/api/locations/wards?districtId=${districtId}`);
        const wards = await res.json();

        wards.forEach(w => {
            const isSelected = (w.code === selectedWard) ? "selected" : "";
            wardSelect.innerHTML += `<option value="${w.code}" ${isSelected}>${w.name}</option>`;
        });
    }

    // ✅ Khi user chọn tỉnh -> load quận
    provinceSelect.addEventListener("change", async () => {
        const provinceId = provinceSelect.value;
        await loadDistricts(provinceId, "");
    });

    // ✅ Khi user chọn quận -> load phường
    districtSelect.addEventListener("change", async () => {
        const districtId = districtSelect.value;
        await loadWards(districtId, "");
    });

    // ✅ Khi reload lại trang search -> tự load lại quận/phường theo lựa chọn cũ
    window.addEventListener("load", async () => {
        const provinceId = provinceSelect.value;

        if (provinceId) {
            await loadDistricts(provinceId, selectedDistrictCode);
        }

        if (selectedDistrictCode) {
            await loadWards(selectedDistrictCode, selectedWardCode);
        }
    });
</script>

</body>
</html>
