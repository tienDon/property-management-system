spring.application.name=Property Management System
spring.profiles.default=local

server.port=${PORT:8080}

# Force UTF-8 Encoding for Requests/Responses
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
spring.servlet.encoding.enabled=true

# VNPay
vnpay.tmnCode=${VNPAY_TMN_CODE:}
vnpay.hashSecret=${VNPAY_HASH_SECRET:}
vnpay.payUrl=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay/return}

# Cloudinary
cloudinary.folder=${CLOUDINARY_FOLDER:property-management}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Gemini API
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
gemini.timeout.connect=${GEMINI_TIMEOUT_CONNECT:5000}
gemini.timeout.read=${GEMINI_TIMEOUT_READ:30000}

# OpenCage Geocoding API (free 2500 req/day)
geocode.api.key=${GEOCODE_API_KEY:}
geocode.api.url=${GEOCODE_API_URL:https://api.opencagedata.com/geocode/v1/json}
geocode.timeout.connect=${GEOCODE_TIMEOUT_CONNECT:3000}
geocode.timeout.read=${GEOCODE_TIMEOUT_READ:5000}
geocode.confidence.min=${GEOCODE_CONFIDENCE_MIN:5}
geocode.radius.confident=${GEOCODE_RADIUS_CONFIDENT:3.0}
geocode.radius.approximate=${GEOCODE_RADIUS_APPROXIMATE:5.0}

# Chat recommendation
chat.recommendation.max-results=${CHAT_RECOMMENDATION_MAX_RESULTS:5}
chat.recommendation.relaxed-budget-multiplier=${CHAT_RECOMMENDATION_RELAXED_BUDGET_MULTIPLIER:1.2}
chat.recommendation.max-history-turns=${CHAT_RECOMMENDATION_MAX_HISTORY_TURNS:4}
chat.session.timeout-minutes=${CHAT_SESSION_TIMEOUT_MINUTES:30}
chat.rate-limit.max-requests=${CHAT_RATE_LIMIT_MAX_REQUESTS:20}
chat.rate-limit.window-minutes=${CHAT_RATE_LIMIT_WINDOW_MINUTES:10}

# Ranking weights
chat.ranking.weight.boost=${CHAT_RANKING_WEIGHT_BOOST:30}
chat.ranking.weight.amenity=${CHAT_RANKING_WEIGHT_AMENITY:25}
chat.ranking.weight.budget-proximity=${CHAT_RANKING_WEIGHT_BUDGET_PROXIMITY:20}
chat.ranking.weight.location=${CHAT_RANKING_WEIGHT_LOCATION:10}
chat.ranking.weight.post-longevity=${CHAT_RANKING_WEIGHT_POST_LONGEVITY:5}

# VNPT AI
vnpt.base-url=${VNPT_BASE_URL:https://api.idg.vnpt.vn}
vnpt.access-token=${VNPT_ACCESS_TOKEN:}
vnpt.token-id=${VNPT_TOKEN_ID:}
vnpt.token-key=${VNPT_TOKEN_KEY:}
vnpt.unit=${VNPT_UNIT:}
vnpt.ekyc.client-session=${VNPT_EKYC_CLIENT_SESSION:ANDROID_nokia7.2_28_Simulator_2.4.2_08d2d8686ee5fa0e_1581910116532}
vnpt.ekyc.token=${VNPT_EKYC_TOKEN:123456}
vnpt.ekyc.crop-param=${VNPT_EKYC_CROP_PARAM:0.14,0.3}
vnpt.ekyc.ocr-type=${VNPT_EKYC_OCR_TYPE:-1}
